<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Den Berk Delice – Buskaarten</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f3f4f4;color:#222}header{background:#7f2d2a;color:#fff;padding:18px 24px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;font-size:13px}main{max-width:1100px;margin:24px auto;padding:0 18px}.panel{background:#fff;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #0001}label{font-size:13px;font-weight:bold;display:block;margin-bottom:6px}input{width:100%;padding:11px;border:1px solid #bbb;border-radius:6px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{border:0;border-radius:6px;padding:11px 16px;font-weight:bold;cursor:pointer;margin:5px 5px 0 0}.primary{background:#7f2d2a;color:#fff}.secondary{background:#e4e6e6}.danger{background:#b23b36;color:#fff}.success{background:#3d7b55;color:#fff}.notice{padding:12px;border-radius:6px;background:#fff4d8;margin-top:12px}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}tr.choice{cursor:pointer}.choice:hover{background:#f1f3f3}.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:11px;font-weight:bold}.active{background:#dcefe2;color:#24623b}.stopped{background:#f4dcdc;color:#8a2626}.buscard{width:140mm;height:100mm;border:1px dashed #555;background:#fff;position:relative;padding:8mm;overflow:hidden}.logo{position:absolute;right:8mm;top:7mm;background:#7f2d2a;color:#fff;padding:7mm 8mm;font-weight:bold;line-height:.9}.logo small{display:block;font-size:8px;margin-top:5px}.title{position:absolute;right:8mm;top:38mm;color:#667272;font-size:18px;font-weight:bold}.personnel-label{color:#7f2d2a;font-size:8px;font-weight:bold}.personnel{font-size:30px;font-weight:800;color:#b44742}.name-label,.loc-label{font-size:8px;font-weight:bold;margin-top:5mm}.name{font-size:17px;font-weight:800}.loc{font-size:20px;font-weight:800}.buses{margin-top:8mm;border-top:1px solid #bbb;padding-top:5mm;font-size:13px;font-weight:bold;color:#666}.qrbox{position:absolute;right:10mm;bottom:8mm;width:42mm;height:42mm;display:flex;align-items:center;justify-content:center;border:1px solid #eee}.footer{position:absolute;left:8mm;bottom:8mm;font-size:7px;font-weight:bold}@media print{body{background:#fff}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0}@page{size:140mm 100mm;margin:0}}
</style>
</head>
<body>
<header><h1>BUSCONTROLE – Buskaarten</h1><p>Den Berk Delice • prototype • kaartformaat 14 × 10 cm</p></header>
<main>
<section class="panel"><h2>1. Medewerker zoeken</h2><div class="grid"><div><label>Personeelsnummer</label><input id="searchNr" placeholder="bv. 8121" oninput="searchEmployees()"></div><div><label>Naam / Badge-ID</label><input id="searchText" placeholder="Zoek op naam of Badge-ID" oninput="searchEmployees()"></div></div><div id="results"></div><div id="duplicateNotice" class="notice hidden"></div></section>
<section id="selectedPanel" class="panel hidden"><h2>2. Geselecteerde medewerker</h2><div id="selectedInfo"></div><button class="primary" onclick="showCard()">🖨️ Buskaart afdrukken</button><button class="secondary" onclick="replaceCard()">🔄 Nieuwe/vervangende kaart</button><button class="danger" onclick="markLost()">❌ Kaart verloren</button><button class="danger" onclick="stopEmployee()">🛑 Medewerker stoppen</button><button class="success" onclick="activateEmployee()">✅ Opnieuw actief</button></section>
<section id="cardPreview" class="panel hidden"><h2>3. Voorbeeld buskaart</h2><div id="printArea"></div><button class="primary" onclick="window.print()">🖨️ AFDRUKKEN</button></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let employees=[{nr:"8121",name:"Abe F2 Fehar Nur",location:"Den Berk",badge:"DBD-TEST-001",buses:["BUS-A","BUS-B"],active:true},{nr:"8121",name:"Test Persoon F3",location:"F3",badge:"DBD-TEST-002",buses:["BUS-C"],active:true},{nr:"9001",name:"Voorbeeld Medewerker",location:"Rijkevorsel",badge:"DBD-TEST-003",buses:["BUS-A"],active:true}];let selected=null;
function searchEmployees(){const nr=document.getElementById('searchNr').value.trim().toLowerCase(),text=document.getElementById('searchText').value.trim().toLowerCase();if(!nr&&!text){document.getElementById('results').innerHTML='';return}const matches=employees.filter(e=>(!nr||e.nr.toLowerCase().includes(nr))&&(!text||e.name.toLowerCase().includes(text)||e.badge.toLowerCase().includes(text)));if(!matches.length){document.getElementById('results').innerHTML='<div class="notice">Geen medewerker gevonden.</div>';return}document.getElementById('results').innerHTML='<table><thead><tr><th>Pers.nr.</th><th>Naam</th><th>Locatie</th><th>Badge-ID</th><th>Status</th></tr></thead><tbody>'+matches.map(e=>`<tr class="choice" onclick="selectEmployee(${employees.indexOf(e)})"><td>${e.nr}</td><td><b>${e.name}</b></td><td>${e.location}</td><td>${e.badge}</td><td><span class="badge ${e.active?'active':'stopped'}">${e.active?'ACTIEF':'GESTOPT'}</span></td></tr>`).join('')+'</tbody></table>';if(nr&&matches.length>1){document.getElementById('duplicateNotice').classList.remove('hidden');document.getElementById('duplicateNotice').innerHTML='<b>Meerdere medewerkers gevonden.</b> Kies eerst de juiste persoon op basis van <b>naam en locatie</b>. Er wordt nooit automatisch een medewerker gewijzigd.'}else document.getElementById('duplicateNotice').classList.add('hidden')}
function selectEmployee(i){selected=employees[i];document.getElementById('selectedPanel').classList.remove('hidden');document.getElementById('selectedInfo').innerHTML=`<div class="grid"><div><b>Naam</b><br>${selected.name}</div><div><b>Personeelsnummer</b><br>${selected.nr}</div><div><b>Locatie</b><br>${selected.location}</div><div><b>Badge-ID</b><br>${selected.badge}</div><div><b>Bussen</b><br>${selected.buses.join(' + ')}</div><div><b>Status</b><br>${selected.active?'ACTIEF':'GESTOPT'}</div></div>`;document.getElementById('cardPreview').classList.add('hidden')}
function showCard(){if(!selected)return;document.getElementById('cardPreview').classList.remove('hidden');document.getElementById('printArea').innerHTML=`<div class="buscard"><div class="logo">den<br>berk<small>DÉLICE</small></div><div class="title">BUSKAART</div><div class="personnel-label">PERSONEELSNUMMER</div><div class="personnel">${selected.nr}</div><div class="name-label">NAAM</div><div class="name">${selected.name}</div><div class="loc-label">LOCATIE</div><div class="loc">${selected.location}</div><div class="buses">🚌 ${selected.buses.join(' + ')}</div><div class="footer">DIT IS EEN PERSOONLIJKE BUSKAART<br>NIET DOORGEVEN<br>Badge-ID: ${selected.badge}</div><div class="qrbox" id="qr"></div></div>`;new QRCode(document.getElementById('qr'),{text:selected.badge,width:150,height:150,correctLevel:QRCode.CorrectLevel.M})}
function markLost(){if(selected)alert('Prototype: kaart van '+selected.name+' wordt als VERLOREN gemarkeerd. Definitieve Microsoft 365-versie: oude Badge-ID ongeldig maken en historiek bewaren.')}function replaceCard(){if(selected)alert('Prototype: nieuwe/vervangende kaart. Definitieve versie: nieuwe Badge-ID/QR-code en historiek.')}
function stopEmployee(){if(selected){selected.active=false;selectEmployee(employees.indexOf(selected));alert(selected.name+' staat nu op GESTOPT.')}}function activateEmployee(){if(selected){selected.active=true;selectEmployee(employees.indexOf(selected));alert(selected.name+' staat nu op ACTIEF.')}}
</script></body></html>
