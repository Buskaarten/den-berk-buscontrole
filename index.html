<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Den Berk Delice - Buscontrole</title>

<script src="https://unpkg.com/html5-qrcode"

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f3f3f3;
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
}

body {
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  padding: 8px 10px 30px 10px;
}

/* =========================================================
   LOGIN
   ========================================================= */

#loginPage {
  display: block;
}

#scannerPage {
  display: none;
}

.logo {
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #b5121b;
  margin: 4px 0 2px 0;
}

.subtitle {
  text-align: center;
  font-size: 15px;
  margin-bottom: 10px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

label {
  display: block;
  font-weight: bold;
  margin: 10px 0 5px 0;
}

input,
select,
button {
  width: 100%;
  min-height: 50px;
  border-radius: 10px;
  font-size: 18px;
}

input,
select {
  border: 1px solid #bbb;

button {

}

}

.error {
  color: #b5121b;

  text-align: center;
  margin-top: 10px;
}

/* =========================================================
   BUS INFO
   ========================================================= */

.busHeader {
  background: #222;
  color: white;
  border-radius: 12px;
  padding: 9px 10px;
  text-align: center;
  margin-bottom: 7px;
}

.busHeader .busNaam {
  font-size: 23px;
  font-weight: bold;
}

.capacityBox {
  background: white;
  border-radius: 12px;
  padding: 9px;
  margin-bottom: 7px;
  text-align: center;
  box-shadow: 0 2px 7px rgba(0,0,0,0.10);
}

.capacityMain {
  font-size: 22px;
  font-weight: bold;
}

.capacityFree {
  font-size: 18px;
  font-weight: bold;
  margin-top: 2px;
}

.capacityStatus {
  font-size: 15px;
  font-weight: bold;
  margin-top: 3px;
}

.capacityNormal {
  background: #ffffff;
}

.capacityWarning {
  background: #fff1b8;
}

.capacityFull {
  background: #e53935;
  color: white;
}

/* =========================================================
   RESULTAAT
   ========================================================= */

#status {
  display: none;
  width: 100%;
  min-height: 88px;
  border-radius: 13px;
  margin-bottom: 7px;
  padding: 8px 10px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 3px 10px rgba(0,0,0,0.16);
  position: relative;
  z-index: 20;
}

#status.green {
  background: #16a34a;
  color: white;
}

#status.red {
  background: #dc2626;
  color: white;
}

.statusBig {
  font-size: 25px;
  line-height: 28px;
}

.statusName {
  font-size: 19px;
  margin-top: 2px;
  line-height: 22px;
}

.statusReason {
  font-size: 14px;
  margin-top: 2px;
  line-height: 17px;
}

/* =========================================================
   CAMERA
   ========================================================= */

.scannerCard {
  background: white;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

.scannerTitle {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 1px 0 5px 0;
}

#reader {
  width: 100%;
  margin: 0 auto;
  border-radius: 12px;
  overflow: hidden;
  background: black;
}

#reader video {
  border-radius: 10px;
}

#loading {
  display: none;
  text-align: center;
  font-size: 15px;
  font-weight: bold;
  padding: 5px;
}

#scannerMessage {
  text-align: center;
  font-size: 14px;
  color: #666;
  margin-top: 7px;
}

/* =========================================================
   BEDIENING ONDERAAN
   ========================================================= */

.controls {
  margin-top: 14px;
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.08);
}

.controlsTitle {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-bottom: 5px;
}

.controlButton {
  background: #555;
  margin-top: 6px;
  min-height: 44px;
  font-size: 16px;
}

.startButton {
  background: #16803c;
}

.stopButton {
  background: #555;
}

.manualButton {
  background: #2563eb;
}

.logoutButton {
  background: #b5121b;
}

/* =========================================================
   HANDMATIGE CONTROLE
   ========================================================= */

#manualPanel {
  display: none;
  margin-top: 10px;
  background: #f8f8f8;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px;
}

.manualTitle {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 8px;
}

.manualInfo {
  font-size: 13px;
  color: #666;
  text-align: center;
  margin-bottom: 6px;
}

.manualButtons {
  display: flex;
  gap: 7px;
}

.manualButtons button {
  flex: 1;
  font-size: 15px;
}

.cancelButton {
  background: #777;
}

.checkButton {
  background: #16803c;
}

</style>
</head>

<body>

<div class="container">

  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <div id="loginPage">

    <div class="logo">
      DEN BERK DELICE
    </div>

    <div class="subtitle">
      Digitale buscontrole
    </div>

    <div class="card">

      <h2 style="text-align:center;">
        Chauffeur aanmelden
      </h2>

      <label for="code">
        Chauffeurscode
      </label>

      <input
        type="password"
        id="code"
        inputmode="numeric"
        placeholder="Code"
        autocomplete="off">

      <label for="bus">
        Kies bus
      </label>

      <select id="bus">

        <option value="">

        </option>

        <option value="BUS-A">
          BUS-A

        <option value="BUS-B">

        </option>

        <option value="BUS-C">
          BUS-C

        <option value="BUS-D">

      <button

        onclick="login()">

        INLOGGEN

      <div

  <!-- =====================================================
       SCANNER
       ===================================================== -->

  <div id="scannerPage">

    <div class="logo">

    </div>

    <!-- BUS -->

    <div class="busHeader">

      <div style="font-size:12px;">
        BUS
      </div>

      <div
        id="busNaam"
        class="busNaam">
        BUS-A
      </div>

    </div>


    <!-- CAPACITEIT -->

    <div
      id="capacityBox"
      class="capacityBox">

      <div
        id="capacityMain"
        class="capacityMain">

      </div>

    <!-- CAMERA -->

    <div class="scannerCard">

    <!-- =================================================

    <div class="controls">

      <!-- HANDMATIGE CONTROLE -->

      <button

      <div id="manualPanel">

        <div class="manualTitle">

        </div>

        <div class="manualInfo">
          Gebruik dit alleen wanneer de medewerker
          zijn buskaart vergeten is.
        </div>

        <label for="manualPersonnel">
          Personeelsnummer
        </label>

        <input
          id="manualPersonnel"
          type="text"
          inputmode="numeric"
          placeholder="Personeelsnummer"
          autocomplete="off">

        <label for="manualLocation">
          Locatie
        </label>

        <select id="manualLocation">

          <option value="">
            -- Kies locatie --
          </option>

          <option value="Den Berk">
            Den Berk
          </option>

          <option value="F1">
            F1
          </option>

          <option value="F3">
            F3
          </option>

          <button
            class="cancelButton"

<script>

/* =========================================================
   CONFIGURATIE
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyilW3j28SCm-7mch8tgdDkp9RzQsi_J-RsUD3ziFP26LVlJuE06fEbiCpPBVqUQntD4w/exec";

let chauffeurToken = "";

let gekozenBus = "";

let scanner = null;

let scannerRunning = false;

let scanBusy = false;

let capacityTimer = null;

let resultTimer = null;

let audioContext = null;


/* =========================================================
   EXTRA SCANBEVEILIGING
   ========================================================= */

let laatsteGesandeBadge = "";

let laatsteScanTijd = 0;

const SCAN_BLOKKADE_MS = 5000;


/* =========================================================
   AUDIO
   ========================================================= */

function initAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    }

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }

  }

  catch (e) {

    console.log(
      "Audio niet beschikbaar",
      e
    );

  }

}


/* =========================================================
   GROEN GELUID
   ========================================================= */

function speelGroenGeluid() {

  try {

    initAudio();

    const now =
      audioContext.currentTime;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
      880,
      now
    );

    oscillator.frequency.setValueAtTime(
      1100,
      now + 0.10
    );

    gain.gain.setValueAtTime(
      0.25,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.22
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start(now);

    oscillator.stop(
      now + 0.23
    );

  }

  catch (e) {

    console.log(e);

  }

}


/* =========================================================
   ROOD GELUID
   ========================================================= */

function speelRoodGeluid() {

  try {

    initAudio();

    const now =
      audioContext.currentTime;

    const osc1 =
      audioContext.createOscillator();

    const gain1 =
      audioContext.createGain();

    osc1.type = "square";

    osc1.frequency.setValueAtTime(
      330,
      now
    );

    gain1.gain.setValueAtTime(
      0.50,
      now
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.28
    );

    osc1.connect(gain1);

    gain1.connect(
      audioContext.destination
    );

    osc1.start(now);

    osc1.stop(
      now + 0.29
    );


    const osc2 =
      audioContext.createOscillator();

    const gain2 =
      audioContext.createGain();

    osc2.type = "square";

    osc2.frequency.setValueAtTime(
      220,
      now + 0.30
    );

    gain2.gain.setValueAtTime(
      0.50,
      now + 0.30
    );

    gain2.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.58
    );

    osc2.connect(gain2);

    gain2.connect(
      audioContext.destination
    );

    osc2.start(
      now + 0.30
    );

    osc2.stop(
      now + 0.59
    );


    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        180,
        80,
        180
      ]);

    }

  }

  catch (e) {

    console.log(e);

  }

}


/* =========================================================
   API
   ========================================================= */

function apiCall(params) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams(
          params
        );


      query.set(
        "callback",
        callbackName
      );


      script.src =
        API_URL +
        "?" +
        query.toString();


      window[callbackName] =
        function(data) {

          try {

            resolve(data);

          }

          finally {

            delete window[
              callbackName
            ];

            if (
              script.parentNode
            ) {

              script.parentNode.removeChild(
                script
              );

            }

          }

        };


      script.onerror =
        function() {

          delete window[
            callbackName
          ];

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }

          reject(
            new Error(
              "API verbinding mislukt."
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

  initAudio();

  const code =
    document
      .getElementById(
        "code"
      )
      .value
      .trim();

  const bus =
    document
      .getElementById(
        "bus"
      )
      .value;

  const error =
    document
      .getElementById(
        "loginError"
      );

  const button =
    document
      .getElementById(
        "loginButton"
      );


  error.textContent = "";


  if (!code) {

    error.textContent =
      "Vul de chauffeurscode in.";

    return;

  }


  if (!bus) {

    error.textContent =
      "Kies eerst een bus.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "AANMELDEN...";


  try {

    const result =
      await apiCall({

        api: "1",

        action: "login",

        code: code

      });


    if (
      !result ||
      !result.toegestaan
    ) {

      error.textContent =
        result &&
        result.reden
          ? result.reden
          : "Aanmelden geweigerd.";

      return;

    }


    chauffeurToken =
      result.token;

    gekozenBus =
      bus;


    document
      .getElementById(
        "busNaam"
      )
      .textContent =
      bus;


    document
      .getElementById(
        "loginPage"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "scannerPage"
      )
      .style.display =
      "block";


    await updateCapacity();

    startScanner();

    startCapacityTimer();

  }

  catch (e) {

    console.error(e);

    error.textContent =
      "Verbinding met de buscontrole mislukt.";

  }

  finally {

    button.disabled = false;

    button.textContent =
      "INLOGGEN";

  }

}


/* =========================================================
   CAPACITEIT
   ========================================================= */

async function updateCapacity() {

  if (
    !gekozenBus ||
    !chauffeurToken
  ) {

    return;

  }


  try {

    const result =
      await apiCall({

        api: "1",

        action: "capacity",

        bus: gekozenBus,

        token: chauffeurToken

      });


    if (
      result
    ) {

      toonCapaciteit(result);

    }

  }

  catch (e) {

    console.log(
      "Capaciteit ophalen mislukt",
      e
    );

  }

}


function toonCapaciteit(result) {

  const box =
    document.getElementById(
      "capacityBox"
    );

  const main =
    document.getElementById(
      "capacityMain"
    );

  const free =
    document.getElementById(
      "capacityFree"
    );

  const status =
    document.getElementById(
      "capacityStatus"
    );


  const gebruikt =
    Number(
      result.gebruiktePlaatsen || 0
    );


  const max =
    Number(
      result.maxPlaatsen || 0
    );


  const vrij =
    Number(
      result.vrijePlaatsen || 0
    );


  main.textContent =
    gebruikt +
    " / " +
    max +
    " GESCAND";


  free.textContent =
    vrij +
    " PLAATSEN VRIJ";


  status.textContent =
    result.capaciteitsStatus ||
    "";


  box.classList.remove(
    "capacityNormal",
    "capacityWarning",
    "capacityFull"
  );


  if (
    result.capaciteitsStatus ===
    "BUS VOL"
  ) {

    box.classList.add(
      "capacityFull"
    );

  }

  else if (
    result.capaciteitsStatus ===
    "LAATSTE PLAATSEN"
  ) {

    box.classList.add(
      "capacityWarning"
    );

  }

  else {

    box.classList.add(
      "capacityNormal"
    );

  }

}


/* =========================================================
   CAPACITEIT TIMER
   ========================================================= */

function startCapacityTimer() {

  stopCapacityTimer();

  capacityTimer =
    setInterval(
      updateCapacity,
      3000
    );

}


function stopCapacityTimer() {

  if (
    capacityTimer
  ) {

    clearInterval(
      capacityTimer
    );

    capacityTimer = null;

  }

}


/* =========================================================
   SCANNER STARTEN
   ========================================================= */

async function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  if (
    !gekozenBus ||
    !chauffeurToken
  ) {

    return;

  }


  try {

    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Camera starten...";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 12,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.70;

        return {
          width: size,
          height: size
        };

      },

      aspectRatio: 1.0

    };


    await scanner.start(
      {
        facingMode: "environment"
      },
      config,
      onScanSuccess,
      onScanFailure
    );


    scannerRunning =
      true;


    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Richt de camera op de QR-code.";

  }

  catch (e) {

    console.error(e);

    scannerRunning =
      false;

    scanner = null;


    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Camera kon niet worden gestart.";

  }

}


/* =========================================================
   SCANNER STOPPEN
   ========================================================= */

async function stopScanner() {

  if (
    !scanner
  ) {

    scannerRunning =
      false;

    return;

  }


  try {

    await scanner.stop();

  }

  catch (e) {

    console.log(
      "Scanner stoppen:",
      e
    );

  }


  try {

    scanner.clear();

  }

  catch (e) {

    console.log(e);

  }


  scannerRunning =
    false;

  scanner = null;


  document
    .getElementById(
      "scannerMessage"
    )
    .textContent =
    "Scanner gestopt.";

}


/* =========================================================
   QR SCAN FAILURE
   ========================================================= */

function onScanFailure(errorMessage) {

  // Bewust leeg.
  // De camera blijft continu scannen.
}


/* =========================================================
   QR SCAN
   ========================================================= */

async function onScanSuccess(
  decodedText
) {

  const badgeId =
    String(
      decodedText || ""
    ).trim();


  if (!badgeId) {

    return;

  }


  const nu =
    Date.now();


  /*
   * Voorkom dat dezelfde QR-code
   * meerdere keren onmiddellijk
   * door de camera wordt herkend.
   */

  if (
    badgeId === laatsteGesandeBadge &&
    (nu - laatsteScanTijd) <
    SCAN_BLOKKADE_MS
  ) {

    return;

  }


  laatsteGesandeBadge =
    badgeId;

  laatsteScanTijd =
    nu;


  if (
    scanBusy
  ) {

    return;

  }


  scanBusy =
    true;


  document
    .getElementById(
      "loading"
    )
    .style.display =
    "block";


  try {

    const result =
      await apiCall({

        api: "1",

        action: "scan",

        badge: badgeId,

        bus: gekozenBus,

        token: chauffeurToken

      });


    toonResultaat(
      result
    );


    if (
      result.toegestaan
    ) {

      speelGroenGeluid();

    }

    else {

      speelRoodGeluid();

    }


    /*
     * Wanneer de backend de nieuwe
     * capaciteit terugstuurt, gebruiken
     * we die onmiddellijk.
     *
     * Anders halen we de capaciteit
     * opnieuw van de server.
     */

    if (
      result.maxPlaatsen !==
      undefined
    ) {

      toonCapaciteit(
        result
      );

    }

    else {

      await updateCapacity();

    }


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

  catch (error) {

    console.error(error);

    toonFout(
      "VERBINDINGSPROBLEEM",
      "Controle kon niet worden uitgevoerd."
    );


    speelRoodGeluid();


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

  finally {

    document
      .getElementById(
        "loading"
      )
      .style.display =
      "none";


    /*
     * Scanner blijft actief.
     */

    scanBusy =
      false;

  }

}


/* =========================================================
   RESULTAAT TONEN
   ========================================================= */

function toonResultaat(result) {

  const status =
    document.getElementById(
      "status"
    );

  const big =
    document.getElementById(
      "statusBig"
    );

  const name =
    document.getElementById(
      "statusName"
    );

  const reason =
    document.getElementById(
      "statusReason"
    );


  status.classList.remove(
    "green",
    "red"
  );


  if (
    result &&
    result.toegestaan
  ) {

    status.classList.add(
      "green"
    );

    big.textContent =
      "✓ TOEGESTAAN";

  }

  else {

    status.classList.add(
      "red"
    );

    big.textContent =
      "✕ NIET TOEGESTAAN";

  }


  name.textContent =
    result &&
    (
      result.naam ||
      result.voornaam ||
      ""
    );


  reason.textContent =
    result &&
    (
      result.reden ||
      result.message ||
      ""
    );


  status.style.display =
    "block";

}


/* =========================================================
   FOUT TONEN
   ========================================================= */

function toonFout(
  titel,
  tekst
) {

  const status =
    document.getElementById(
      "status"
    );

  const big =
    document.getElementById(
      "statusBig"
    );

  const name =
    document.getElementById(
      "statusName"
    );

  const reason =
    document.getElementById(
      "statusReason"
    );


  status.classList.remove(
    "green"
  );

  status.classList.add(
    "red"
  );


  big.textContent =
    titel;


  name.textContent =
    "";


  reason.textContent =
    tekst;


  status.style.display =
    "block";

}


/* =========================================================
   RESULTAAT VERBERGEN
   ========================================================= */

function verbergResultaat() {

  const status =
    document.getElementById(
      "status"
    );

  status.style.display =
    "none";

}


/* =========================================================
   HANDMATIGE CONTROLE OPENEN
   ========================================================= */

function openManualPanel() {

  const panel =
    document.getElementById(
      "manualPanel"
    );


  panel.style.display =
    "block";


  document
    .getElementById(
      "manualPersonnel"
    )
    .focus();

}


/* =========================================================
   HANDMATIGE CONTROLE SLUITEN
   ========================================================= */

function closeManualPanel() {

  document
    .getElementById(
      "manualPanel"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "manualPersonnel"
    )
    .value =
    "";


  document
    .getElementById(
      "manualLocation"
    )
    .value =
    "";

}


/* =========================================================
   PERSONEELSNUMMER + LOCATIE
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const personnelInput =
      document.getElementById(
        "manualPersonnel"
      );


    if (
      personnelInput
    ) {

      personnelInput.addEventListener(
        "change",
        zoekHandmatigeMedewerker
      );

      personnelInput.addEventListener(
        "blur",
        zoekHandmatigeMedewerker
      );

    }

  }
);


/* =========================================================
   MEDEWERKER OPZOEKEN
   ========================================================= */

async function zoekHandmatigeMedewerker() {

  const personnel =
    document
      .getElementById(
        "manualPersonnel"
      )
      .value
      .trim();


  if (!personnel) {

    return;

  }


  if (!chauffeurToken) {

    return;

  }


  try {

    const result =
      await apiCall({

        api: "1",

        action: "findEmployee",

        personeelsnummer:
          personnel,

        token:
          chauffeurToken

      });


    const locationSelect =
      document.getElementById(
        "manualLocation"
      );


    /*
     * Eerst bestaande keuzes wissen.
     */

    locationSelect.innerHTML = "";


    const defaultOption =
      document.createElement(
        "option"
      );

    defaultOption.value =
      "";

    defaultOption.textContent =
      "-- Kies locatie --";

    locationSelect.appendChild(
      defaultOption
    );


    if (
      !result ||
      !result.gevonden
    ) {

      /*
       * Wanneer backend geen
       * medewerkers vindt, blijven
       * de standaardlocaties beschikbaar.
       */

      voegLocatieToe(
        locationSelect,
        "Den Berk"
      );

      voegLocatieToe(
        locationSelect,
        "F1"
      );

      voegLocatieToe(
        locationSelect,
        "F3"
      );

      voegLocatieToe(
        locationSelect,
        "Rijkevorsel"
      );

      voegLocatieToe(
        locationSelect,
        "Noorderwijk"
      );

      return;

    }


    const medewerkers =
      result.medewerkers ||
      result.matches ||
      [];


    if (
      medewerkers.length === 1
    ) {

      const medewerker =
        medewerkers[0];


      const locatie =
        medewerker.locatie ||
        medewerker.Locatie ||
        "";


      if (locatie) {

        voegLocatieToe(
          locationSelect,
          locatie,
          true
        );

      }

      return;

    }


    if (
      medewerkers.length > 1
    ) {

      medewerkers.forEach(
        function(medewerker) {

          const locatie =
            medewerker.locatie ||
            medewerker.Locatie ||
            "";

          if (locatie) {

            voegLocatieToe(
              locationSelect,
              locatie
            );

          }

        }
      );

      return;

    }


    /*
     * Alternatieve structuur
     * als backend rechtstreeks
     * een locaties-array terugstuurt.
     */

    if (
      Array.isArray(
        result.locaties
      )
    ) {

      result.locaties.forEach(
        function(locatie) {

          voegLocatieToe(
            locationSelect,
            locatie
          );

        }
      );

    }

  }

  catch (e) {

    console.log(
      "Medewerker zoeken mislukt:",
      e
    );

  }

}


/* =========================================================
   LOCATIE TOEVOEGEN
   ========================================================= */

function voegLocatieToe(
  select,
  locatie,
  selecteer
) {

  if (!locatie) {

    return;

  }


  const bestaat =
    Array.from(
      select.options
    ).some(
      function(option) {

        return (
          option.value.toLowerCase() ===
          String(locatie).toLowerCase()
        );

      }
    );


  if (
    bestaat
  ) {

    if (selecteer) {

      select.value =
        locatie;

    }

    return;

  }


  const option =
    document.createElement(
      "option"
    );


  option.value =
    locatie;

  option.textContent =
    locatie;


  select.appendChild(
    option
  );


  if (selecteer) {

    select.value =
      locatie;

  }

}


/* =========================================================
   HANDMATIGE CONTROLE
   ========================================================= */

async function manualCheck() {

  const personnel =
    document
      .getElementById(
        "manualPersonnel"
      )
      .value
      .trim();


  const location =
    document
      .getElementById(
        "manualLocation"
      )
      .value;


  if (!personnel) {

    alert(
      "Vul het personeelsnummer in."
    );

    return;

  }


  if (!location) {

    alert(
      "Kies de locatie."
    );

    return;

  }


  if (!gekozenBus) {

    alert(
      "Er is geen bus geselecteerd."
    );

    return;

  }


  if (!chauffeurToken) {

    alert(
      "Chauffeur is niet aangemeld."
    );

    return;

  }


  try {

    const result =
      await apiCall({

        api: "1",

        action: "manual",

        /*
         * BELANGRIJKE FIX:
         *
         * De Apps Script backend verwacht
         * "personeelsnummer".
         *
         * Niet "personnel".
         */

        personeelsnummer:
          personnel,

        locatie:
          location,

        bus:
          gekozenBus,

        token:
          chauffeurToken

      });


    toonResultaat(
      result
    );


    if (
      result.toegestaan
    ) {

      speelGroenGeluid();

    }

    else {

      speelRoodGeluid();

    }


    /*
     * Als de backend de nieuwe capaciteit
     * rechtstreeks teruggeeft, tonen we die
     * onmiddellijk.
     */

    if (
      result.maxPlaatsen !==
      undefined
    ) {

      toonCapaciteit(
        result
      );

    }

    else {

      /*
       * Anders rechtstreeks opnieuw
       * bij Google Sheets / Apps Script
       * ophalen.
       */

      await updateCapacity();

    }


    /*
     * EXTRA BEVEILIGING / SYNCHRONISATIE
     *
     * Ook wanneer de backend een resultaat
     * terugstuurt zonder capaciteit, halen
     * we na 500 ms opnieuw de echte serverstand
     * op.
     *
     * Hierdoor moet een geslaagde handmatige
     * controle zichtbaar worden als:
     *
     *  10 / 50 GESCAND
     *
     * en:
     *
     *  40 PLAATSEN VRIJ
     */

    if (
      result.toegestaan
    ) {

      setTimeout(
        updateCapacity,
        500
      );

    }


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );


    closeManualPanel();

  }

  catch (error) {

    console.error(error);

    toonFout(
      "FOUT",
      "Handmatige controle kon niet worden uitgevoerd."
    );


    speelRoodGeluid();


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

}

}
