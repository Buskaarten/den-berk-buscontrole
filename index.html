<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Den Berk Delice - Buscontrole</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f3f3f3;
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
}

body {
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  padding: 8px 10px 30px 10px;
}

/* =========================================================
   LOGIN
   ========================================================= */

#loginPage {
  display: block;
}

#scannerPage {
  display: none;
}

.logo {
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #b5121b;
  margin: 4px 0 2px 0;
}

.subtitle {
  text-align: center;
  font-size: 15px;
  margin-bottom: 10px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

label {
  display: block;
  font-weight: bold;
  margin: 10px 0 5px 0;
}

input,
select,
button {
  width: 100%;
  min-height: 50px;
  border-radius: 10px;
  font-size: 18px;
}

input,
select {
  border: 1px solid #bbb;
  padding: 10px;
  background: white;
}

button {
  border: none;
  background: #b5121b;
  color: white;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

button:disabled {
  background: #999;
}

.error {
  color: #b5121b;
  font-weight: bold;
  text-align: center;
  margin-top: 10px;
}

/* =========================================================
   BUS INFO
   ========================================================= */

.busHeader {
  background: #222;
  color: white;
  border-radius: 12px;
  padding: 9px 10px;
  text-align: center;
  margin-bottom: 7px;
}

.busHeader .busNaam {
  font-size: 23px;
  font-weight: bold;
}

.capacityBox {
  background: white;
  border-radius: 12px;
  padding: 9px;
  margin-bottom: 7px;
  text-align: center;
  box-shadow: 0 2px 7px rgba(0,0,0,0.10);
}

.capacityMain {
  font-size: 22px;
  font-weight: bold;
}

.capacityFree {
  font-size: 18px;
  font-weight: bold;
  margin-top: 2px;
}

.capacityStatus {
  font-size: 15px;
  font-weight: bold;
  margin-top: 3px;
}

.capacityNormal {
  background: #ffffff;
}

.capacityWarning {
  background: #fff1b8;
}

.capacityFull {
  background: #e53935;
  color: white;
}

/* =========================================================
   RESULTAAT
   ========================================================= */

#status {
  display: none;
  width: 100%;
  min-height: 88px;
  border-radius: 13px;
  margin-bottom: 7px;
  padding: 8px 10px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 3px 10px rgba(0,0,0,0.16);
  position: relative;
  z-index: 20;
}

#status.green {
  background: #16a34a;
  color: white;
}

#status.red {
  background: #dc2626;
  color: white;
}

.statusBig {
  font-size: 25px;
  line-height: 28px;
}

.statusName {
  font-size: 19px;
  margin-top: 2px;
  line-height: 22px;
}

.statusReason {
  font-size: 14px;
  margin-top: 2px;
  line-height: 17px;
}

/* =========================================================
   CAMERA
   ========================================================= */

.scannerCard {
  background: white;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

.scannerTitle {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 1px 0 5px 0;
}

#reader {
  width: 100%;
  margin: 0 auto;
  border-radius: 12px;
  overflow: hidden;
  background: black;
}

#reader video {
  border-radius: 10px;
}

#loading {
  display: none;
  text-align: center;
  font-size: 15px;
  font-weight: bold;
  padding: 5px;
}

#scannerMessage {
  text-align: center;
  font-size: 14px;
  color: #666;
  margin-top: 7px;
}

/* =========================================================
   BEDIENING ONDERAAN
   ========================================================= */

.controls {
  margin-top: 14px;
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.08);
}

.controlsTitle {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-bottom: 5px;
}

.controlButton {
  background: #555;
  margin-top: 6px;
  min-height: 44px;
  font-size: 16px;
}

.startButton {
  background: #16803c;
}

.stopButton {
  background: #555;
}

.manualButton {
  background: #2563eb;
}

.logoutButton {
  background: #b5121b;
}

/* =========================================================
   HANDMATIGE CONTROLE
   ========================================================= */

#manualPanel {
  display: none;
  margin-top: 10px;
  background: #f8f8f8;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px;
}

.manualTitle {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 8px;
}

.manualInfo {
  font-size: 13px;
  color: #666;
  text-align: center;
  margin-bottom: 6px;
}

.manualButtons {
  display: flex;
  gap: 7px;
}

.manualButtons button {
  flex: 1;
  font-size: 15px;
}

.cancelButton {
  background: #777;
}

.checkButton {
  background: #16803c;
}

</style>
</head>

<body>

<div class="container">

  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <div id="loginPage">

    <div class="logo">
      DEN BERK DELICE
    </div>

    <div class="subtitle">
      Digitale buscontrole
    </div>

    <div class="card">

      <h2 style="text-align:center;">
        Chauffeur aanmelden
      </h2>

      <label for="code">
        Chauffeurscode
      </label>

      <input
        type="password"
        id="code"
        inputmode="numeric"
        placeholder="Code"
        autocomplete="off">

      <label for="bus">
        Kies bus
      </label>

      <select id="bus">

        <option value="">
          -- Kies bus --
        </option>

        <option value="BUS-A">
          BUS-A
        </option>

        <option value="BUS-B">
          BUS-B
        </option>

        <option value="BUS-C">
          BUS-C
        </option>

        <option value="BUS-D">
          BUS-D
        </option>

      </select>

      <button
        id="loginButton"
        onclick="login()">

        INLOGGEN

      </button>

      <div
        id="loginError"
        class="error">
      </div>

    </div>

  </div>


  <!-- =====================================================
       SCANNER
       ===================================================== -->

  <div id="scannerPage">

    <div class="logo">
      DEN BERK DELICE
    </div>

    <!-- BUS -->

    <div class="busHeader">

      <div style="font-size:12px;">
        BUS
      </div>

      <div
        id="busNaam"
        class="busNaam">
        BUS-A
      </div>

    </div>


    <!-- CAPACITEIT -->

    <div
      id="capacityBox"
      class="capacityBox">

      <div
        id="capacityMain"
        class="capacityMain">

        0 / 0 GESCAND

      </div>

      <div
        id="capacityFree"
        class="capacityFree">

        0 PLAATSEN VRIJ

      </div>

      <div
        id="capacityStatus"
        class="capacityStatus">
      </div>

    </div>


    <!-- RESULTAAT BOVEN CAMERA -->

    <div id="status">

      <div
        id="statusBig"
        class="statusBig">
      </div>

      <div
        id="statusName"
        class="statusName">
      </div>

      <div
        id="statusReason"
        class="statusReason">
      </div>

    </div>


    <!-- CAMERA -->

    <div class="scannerCard">

      <div class="scannerTitle">
        📷 SCAN BUSKAART
      </div>

      <div id="reader"></div>

      <div
        id="loading">
        Controleren...
      </div>

      <div id="scannerMessage">
        Richt de camera op de QR-code.
      </div>

    </div>


    <!-- =================================================
         BEDIENING ONDERAAN
         ================================================= -->

    <div class="controls">

      <div class="controlsTitle">
        BEDIENING
      </div>

      <button
        class="controlButton startButton"
        onclick="startScanner()">

        ▶ SCANNER STARTEN

      </button>

      <button
        class="controlButton stopButton"
        onclick="stopScanner()">

        ■ SCANNER STOPPEN

      </button>


      <!-- HANDMATIGE CONTROLE -->

      <button
        class="controlButton manualButton"
        onclick="openManualPanel()">

        👤 HANDMATIGE CONTROLE

      </button>


      <div id="manualPanel">

        <div class="manualTitle">
          Handmatige controle
        </div>

        <div class="manualInfo">
          Gebruik dit alleen wanneer de medewerker
          zijn buskaart vergeten is.
        </div>

        <label for="manualPersonnel">
          Personeelsnummer
        </label>

        <input
          id="manualPersonnel"
          type="text"
          inputmode="numeric"
          placeholder="Personeelsnummer"
          autocomplete="off">

        <label for="manualLocation">
          Locatie
        </label>

        <select id="manualLocation">

          <option value="">
            -- Eerst personeelsnummer ingeven --
          </option>

        </select>

        <div class="manualButtons">

          <button
            class="cancelButton"
            onclick="closeManualPanel()">

            ANNULEREN

          </button>

          <button
            class="checkButton"
            onclick="manualCheck()">

            CONTROLEREN

          </button>

        </div>

      </div>


      <button
        class="controlButton logoutButton"
        onclick="logout()">

        UITLOGGEN

      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   INSTELLINGEN
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyilW3j28SCm-7mch8tgdDkp9RzQsi_J-RsUD3ziFP26LVlJuE06fEbiCpPBVqUQntD4w/exec";

let chauffeurToken = "";
let gekozenBus = "";
let scanner = null;
let scannerRunning = false;
let scanBusy = false;
let resultTimer = null;
let capacityTimer = null;


/* =========================================================
   API CALL
   ========================================================= */

function apiCall(params) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "jsonpCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const script =
      document.createElement("script");

    let finished = false;

    window[callbackName] =
      function(data) {

        if (finished) return;

        finished = true;

        try {
          delete window[callbackName];
        } catch (e) {}

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        resolve(data);
      };

    script.onerror =
      function() {

        if (finished) return;

        finished = true;

        try {
          delete window[callbackName];
        } catch (e) {}

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        reject(
          new Error(
            "API verbinding mislukt"
          )
        );

      };

    const query =
      new URLSearchParams();

    Object.keys(params).forEach(
      function(key) {

        if (
          params[key] !== undefined &&
          params[key] !== null
        ) {

          query.append(
            key,
            params[key]
          );

        }

      }
    );

    query.append(
      "callback",
      callbackName
    );

    script.src =
      API_URL +
      "?" +
      query.toString();

    document.body.appendChild(
      script
    );

    setTimeout(
      function() {

        if (finished) return;

        finished = true;

        try {
          delete window[callbackName];
        } catch (e) {}

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        reject(
          new Error(
            "Timeout bij API"
          )
        );

      },
      15000
    );

  });

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

  const code =
    document
      .getElementById("code")
      .value
      .trim();

  const bus =
    document
      .getElementById("bus")
      .value;

  const error =
    document
      .getElementById("loginError");

  const button =
    document
      .getElementById("loginButton");


  error.textContent = "";


  if (!code) {

    error.textContent =
      "Vul de chauffeurscode in.";

    return;

  }


  if (!bus) {

    error.textContent =
      "Kies eerst een bus.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "AANMELDEN...";


  try {

    const result =
      await apiCall({

        api: "1",

        action: "login",

        code: code,

        bus: bus

      });


    if (
      result &&
      result.toegestaan
    ) {

      chauffeurToken =
        result.token || "";

      gekozenBus =
        result.bus || bus;


      document
        .getElementById(
          "loginPage"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "scannerPage"
        )
        .style.display =
        "block";


      document
        .getElementById(
          "busNaam"
        )
        .textContent =
        gekozenBus;


      await updateCapacity();

      startCapacityTimer();

      startScanner();

    }

    else {

      error.textContent =
        (
          result &&
          (
            result.reden ||
            result.message
          )
        ) ||
        "Aanmelden mislukt.";

    }

  }

  catch (e) {

    console.error(e);

    error.textContent =
      "Aanmelden mislukt. Controleer de verbinding.";

  }

  finally {

    button.disabled = false;

    button.textContent =
      "INLOGGEN";

  }

}


/* =========================================================
   CAPACITEIT
   ========================================================= */

async function updateCapacity() {

  if (!gekozenBus || !chauffeurToken) {
    return;
  }

  try {

    const result =
      await apiCall({

        api: "1",

        action: "capacity",

        bus: gekozenBus,

        token: chauffeurToken

      });


    if (
      result &&
      result.ok
    ) {

      toonCapaciteit(
        result
      );

    }

  }

  catch (error) {

    console.error(
      "Capaciteit:",
      error
    );

  }

}


function toonCapaciteit(
  result
) {

  const max =
    Number(
      result.maxPlaatsen || 0
    );

  const aantal =
    Number(
      result.aantalGeslaagd ||
      result.aantal ||
      result.gescand ||
      0
    );

  const vrij =
    Math.max(
      0,
      max - aantal
    );


  const box =
    document.getElementById(
      "capacityBox"
    );


  const main =
    document.getElementById(
      "capacityMain"
    );


  const free =
    document.getElementById(
      "capacityFree"
    );


  const status =
    document.getElementById(
      "capacityStatus"
    );


  main.textContent =
    aantal +
    " / " +
    max +
    " GESCAND";


  free.textContent =
    vrij +
    " PLAATSEN VRIJ";


  box.classList.remove(
    "capacityNormal",
    "capacityWarning",
    "capacityFull"
  );


  if (vrij <= 0) {

    box.classList.add(
      "capacityFull"
    );

    status.textContent =
      "🛑 BUS VOL";

  }

  else if (vrij <= 10) {

    box.classList.add(
      "capacityWarning"
    );

    status.textContent =
      "⚠️ NOG " +
      vrij +
      " PLAATSEN";

  }

  else {

    box.classList.add(
      "capacityNormal"
    );

    status.textContent =
      "";

  }

}


function startCapacityTimer() {

  stopCapacityTimer();

  capacityTimer =
    setInterval(
      updateCapacity,
      10000
    );

}


function stopCapacityTimer() {

  if (capacityTimer) {

    clearInterval(
      capacityTimer
    );

    capacityTimer = null;

  }

}


/* =========================================================
   SCANNER STARTEN
   ========================================================= */

async function startScanner() {

  if (scannerRunning) {
    return;
  }


  if (!scanner) {

    scanner =
      new Html5Qrcode(
        "reader"
      );

  }


  try {

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 12,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.min(
                width,
                height
              ) * 0.72;

            return {
              width: size,
              height: size
            };

          },

        aspectRatio:
          1.0

      },

      onScanSuccess,

      onScanFailure

    );


    scannerRunning =
      true;


    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Scanner actief — scan de buskaart.";


  }

  catch (error) {

    console.error(
      error
    );


    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Camera kon niet worden gestart. Geef cameratoegang.";

  }

}


/* =========================================================
   SCANNER STOPPEN
   ========================================================= */

async function stopScanner() {

  if (
    !scanner ||
    !scannerRunning
  ) {

    return;

  }


  try {

    await scanner.stop();

    scanner.clear();

  }

  catch (error) {

    console.error(
      error
    );

  }


  scannerRunning =
    false;

}


/* =========================================================
   QR SCAN
   ========================================================= */

async function onScanSuccess(
  decodedText
) {

  if (scanBusy) {
    return;
  }


  const badgeId =
    String(
      decodedText || ""
    ).trim();


  if (!badgeId) {
    return;
  }


  scanBusy =
    true;


  document
    .getElementById(
      "loading"
    )
    .style.display =
    "block";


  try {

    const result =
      await apiCall({

        api: "1",

        action: "scan",

        badge: badgeId,

        bus: gekozenBus,

        token: chauffeurToken

      });


    toonResultaat(
      result
    );


    if (
      result.toegestaan
    ) {

      speelGroenGeluid();

    }

    else {

      speelRoodGeluid();

    }


    if (
      result.maxPlaatsen !==
      undefined
    ) {

      toonCapaciteit(
        result
      );

    }

    else {

      updateCapacity();

    }


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

  catch (error) {

    console.error(error);

    toonFout(
      "VERBINDINGSPROBLEEM",
      "Controle kon niet worden uitgevoerd."
    );


    speelRoodGeluid();


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

  finally {

    document
      .getElementById(
        "loading"
      )
      .style.display =
      "none";


    setTimeout(
      function() {

        scanBusy =
          false;

      },
      150
    );

  }

}


function onScanFailure(
  errorMessage
) {

  /*
   * Geen melding.
   * Scanner blijft zoeken.
   */

}


/* =========================================================
   RESULTAAT
   ========================================================= */

function toonResultaat(
  result
) {

  const status =
    document.getElementById(
      "status"
    );


  const big =
    document.getElementById(
      "statusBig"
    );


  const name =
    document.getElementById(
      "statusName"
    );


  const reason =
    document.getElementById(
      "statusReason"
    );


  status.style.display =
    "block";


  status.classList.remove(
    "green",
    "red"
  );


  if (
    result.toegestaan
  ) {

    status.classList.add(
      "green"
    );


    big.textContent =
      "🟢 TOEGELATEN";


    name.textContent =
      result.naam ||
      "";


    reason.textContent =
      (
        result.locatie ||
        ""
      ) +
      (
        result.locatie
          ? " • "
          : ""
      ) +
      (
        result.bus ||
        gekozenBus
      );

  }

  else {

    status.classList.add(
      "red"
    );


    big.textContent =
      "🔴 NIET TOEGELATEN";


    name.textContent =
      result.naam ||
      "";


    reason.textContent =
      result.reden ||
      "Geen toegang";

  }

}


/* =========================================================
   FOUT
   ========================================================= */

function toonFout(
  titel,
  tekst
) {

  const status =
    document.getElementById(
      "status"
    );


  status.style.display =
    "block";


  status.classList.remove(
    "green"
  );


  status.classList.add(
    "red"
  );


  document
    .getElementById(
      "statusBig"
    )
    .textContent =
    "🔴 " + titel;


  document
    .getElementById(
      "statusName"
    )
    .textContent =
    "";


  document
    .getElementById(
      "statusReason"
    )
    .textContent =
    tekst;

}


/* =========================================================
   RESULTAAT VERBERGEN
   ========================================================= */

function verbergResultaat() {

  const status =
    document.getElementById(
      "status"
    );


  status.style.display =
    "none";


  document
    .getElementById(
      "statusBig"
    )
    .textContent =
    "";


  document
    .getElementById(
      "statusName"
    )
    .textContent =
    "";


  document
    .getElementById(
      "statusReason"
    )
    .textContent =
    "";

}


/* =========================================================
   GELUIDEN
   ========================================================= */

function speelGroenGeluid() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      880;


    gain.gain.setValueAtTime(
      0.28,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + 0.35
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    oscillator.start();

    oscillator.stop(
      ctx.currentTime + 0.35
    );

  }

  catch (e) {

    console.error(e);

  }

}


function speelRoodGeluid() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }


    const ctx =
      new AudioContext();


    /*
     * Rood = ongeveer dubbel zo luid
     * als groen.
     */

    function beep(
      frequency,
      startTime,
      duration
    ) {

      const oscillator =
        ctx.createOscillator();


      const gain =
        ctx.createGain();


      oscillator.type =
        "square";


      oscillator.frequency.value =
        frequency;


      gain.gain.setValueAtTime(
        0.55,
        startTime
      );


      gain.gain.exponentialRampToValueAtTime(
        0.001,
        startTime + duration
      );


      oscillator.connect(
        gain
      );


      gain.connect(
        ctx.destination
      );


      oscillator.start(
        startTime
      );


      oscillator.stop(
        startTime + duration
      );

    }


    beep(
      420,
      ctx.currentTime,
      0.22
    );


    beep(
      300,
      ctx.currentTime + 0.25,
      0.30
    );

  }

  catch (e) {

    console.error(e);

  }

}

/* =========================================================
   LOCATIES OPHALEN OP BASIS VAN PERSONEELSNUMMER
   ========================================================= */

async function laadManualLocaties() {

  const personnel =
    document
      .getElementById(
        "manualPersonnel"
      )
      .value
      .trim();


  const select =
    document
      .getElementById(
        "manualLocation"
      );


  if (!personnel) {

    select.innerHTML =
      '<option value="">-- Eerst personeelsnummer ingeven --</option>';

    return;

  }


  select.innerHTML =
    '<option value="">Locaties zoeken...</option>';


  try {

    const result =
      await apiCall({

        api: "1",

        action: "findEmployee",

        personeelsnummer:
          personnel,

        token:
          chauffeurToken

      });


    if (!result.ok) {

      select.innerHTML =
        '<option value="">Geen medewerker gevonden</option>';

      return;

    }


    const medewerkers =
      result.medewerkers ||
      result.employees ||
      result.items ||
      [];


    const locaties = [];


    medewerkers.forEach(
      function(medewerker) {

        const locatie =
          String(
            medewerker.locatie ||
            medewerker.location ||
            ""
          ).trim();


        if (
          locatie &&
          !locaties.some(
            function(bestaande) {

              return (
                bestaande.toUpperCase() ===
                locatie.toUpperCase()
              );

            }
          )
        ) {

          locaties.push(
            locatie
          );

        }

      }
    );


    select.innerHTML =
      "";


    if (!locaties.length) {

      select.innerHTML =
        '<option value="">Geen locatie gevonden</option>';

      return;

    }


    const eerste =
      document.createElement(
        "option"
      );


    eerste.value =
      "";


    eerste.textContent =
      "-- Kies locatie --";


    select.appendChild(
      eerste
    );


    locaties.forEach(
      function(locatie) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          locatie;


        option.textContent =
          locatie;


        select.appendChild(
          option
        );

      }
    );


    if (
      locaties.length === 1
    ) {

      select.value =
        locaties[0];

    }

  }

  catch (error) {

    console.error(
      error
    );


    select.innerHTML =
      '<option value="">Fout bij ophalen locatie</option>';

  }

}


/* =========================================================
   HANDMATIGE CONTROLE UITVOEREN
   ========================================================= */

async function manualCheck() {

  const personnel =
    document
      .getElementById(
        "manualPersonnel"
      )
      .value
      .trim();


  const location =
    document
      .getElementById(
        "manualLocation"
      )
      .value
      .trim();


  if (!personnel) {

    alert(
      "Vul het personeelsnummer in."
    );

    return;

  }


  if (!location) {

    await laadManualLocaties();


    alert(
      "Kies de juiste locatie."
    );

    return;

  }


  try {

    const result =
      await apiCall({

        api: "1",

        action: "manual",

        /*
         * BELANGRIJK:
         * Backend verwacht
         * personeelsnummer.
         */

        personeelsnummer:
          personnel,

        locatie:
          location,

        bus:
          gekozenBus,

        token:
          chauffeurToken

      });


    toonResultaat(
      result
    );


    if (
      result.toegestaan
    ) {

      speelGroenGeluid();

    }

    else {

      speelRoodGeluid();

    }


    if (
      result.maxPlaatsen !==
      undefined
    ) {

      toonCapaciteit(
        result
      );

    }

    else {

      updateCapacity();

    }


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );


    closeManualPanel();

  }

  catch (error) {

    console.error(
      error
    );


    toonFout(
      "FOUT",
      "Handmatige controle kon niet worden uitgevoerd."
    );


    speelRoodGeluid();


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

}
