<style>

}

}

/* =========================================================
   HULPTEKST
   ========================================================= */

  margin-top: 8px;

<body>

<div class="container">

    </div>

      <div style="font-size:12px;">

      </div>

        id="busNaam"
        class="busNaam">
        BUS-A

    </div>


    <!-- CAPACITEIT -->
    <div
      id="capacityBox"
      class="capacityBox">

      <div
        id="capacityMain"
        class="capacityMain">

        0 / 0 GESCAND

      </div>

      <div
        id="capacityFree"
        class="capacityFree">

        PLAATSEN VRIJ: --

      </div>

      <div
        id="capacityStatus"
        class="capacityStatus">

      </div>

    </div>


    <!-- RESULTAAT BOVEN CAMERA -->
    <div id="status">

      <div
        id="statusBig"
        class="statusBig">
      </div>

      <div
        id="statusName"
        class="statusName">
      </div>

        id="statusReason"
        class="statusReason">

    <!-- CAMERA -->
    <div class="scannerCard">

  </div>

<script>

/* =========================================================
   CONFIGURATIE
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyilW3j28SCm-7mch8tgdDkp9RzQsi_J-RsUD3ziFP26LVlJuE06fEbiCpPBVqUQntD4w/exec";


let chauffeurToken = "";

let gekozenBus = "";

let scanner = null;

let scannerRunning = false;

let scanBusy = false;

let capacityTimer = null;

let resultTimer = null;


/* =========================================================
   AUDIO
   ========================================================= */

let audioContext = null;


/*
 * Audio activeren nadat chauffeur
 * op INLOGGEN drukt.
 */

function initAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    }

    if (audioContext.state === "suspended") {

      audioContext.resume();

    }

  }

  catch (e) {

    console.log("Audio niet beschikbaar", e);

  }

}


/*
 * GROEN GELUID
 */

function speelGroenGeluid() {

  try {

    initAudio();

    const now =
      audioContext.currentTime;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
      880,
      now
    );

    oscillator.frequency.setValueAtTime(
      1100,
      now + 0.10
    );

    /*
     * Groen = normaal volume
     */
    gain.gain.setValueAtTime(
      0.25,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.22
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start(now);

    oscillator.stop(
      now + 0.23
    );

  }

  catch (e) {

    console.log(e);

  }

}


/*
 * ROOD GELUID
 *
 * Bewust ongeveer 2x de amplitude
 * van het groene geluid.
 */

function speelRoodGeluid() {

  try {

    initAudio();

    const now =
      audioContext.currentTime;


    /*
     * Eerste harde toon
     */

    const osc1 =
      audioContext.createOscillator();

    const gain1 =
      audioContext.createGain();

    osc1.type = "square";

    osc1.frequency.setValueAtTime(
      330,
      now
    );

    gain1.gain.setValueAtTime(
      0.50,
      now
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.28
    );

    osc1.connect(gain1);

    gain1.connect(
      audioContext.destination
    );

    osc1.start(now);

    osc1.stop(
      now + 0.29
    );


    /*
     * Tweede toon
     */

    const osc2 =
      audioContext.createOscillator();

    const gain2 =
      audioContext.createGain();

    osc2.type = "square";

    osc2.frequency.setValueAtTime(
      220,
      now + 0.30
    );

    gain2.gain.setValueAtTime(
      0.50,
      now + 0.30
    );

    gain2.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.58
    );

    osc2.connect(gain2);

    gain2.connect(
      audioContext.destination
    );

    osc2.start(
      now + 0.30
    );

    osc2.stop(
      now + 0.59
    );


    /*
     * Trilling indien ondersteund
     */

    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        180,
        80,
        180
      ]);

    }

  }

  catch (e) {

    console.log(e);

  }

}


/* =========================================================
   API
   ========================================================= */

function apiCall(params) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams(
          params
        );


      query.set(
        "callback",
        callbackName
      );


      script.src =
        API_URL +
        "?" +
        query.toString();


      window[callbackName] =
        function(data) {

          try {

            resolve(data);

          }

          finally {

            delete window[
              callbackName
            ];

            if (
              script.parentNode
            ) {

              script.parentNode.removeChild(
                script
              );

            }

          }

        };


      script.onerror =
        function() {

          delete window[
            callbackName
          ];

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }

          reject(
            new Error(
              "Kan server niet bereiken."
            )
          );

        };


      document.body.appendChild(
        script
      );


      setTimeout(
        () => {

          if (
            window[callbackName]
          ) {

            delete window[
              callbackName
            ];

            if (
              script.parentNode
            ) {

              script.parentNode.removeChild(
                script
              );

            }

            reject(
              new Error(
                "Server reageert niet."
              )
            );

          }

        },
        15000
      );

    }
  );

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

  initAudio();

  const code =
    document
      .getElementById("code")
      .value
      .trim();


  const bus =
    document
      .getElementById("bus")
      .value;


  const error =
    document
      .getElementById("loginError");


  error.textContent = "";


  if (!code) {

    error.textContent =
      "Vul de chauffeurscode in.";

    return;

  }


  if (!bus) {

    error.textContent =
      "Kies eerst een bus.";

    return;

  }


  const button =
    document
      .getElementById("loginButton");


  button.disabled = true;

  button.textContent =
    "INLOGGEN...";


  try {

    const result =
      await apiCall({

        api: "1",

        action: "login",

        code: code

      });


    if (
      !result.toegestaan
    ) {

      error.textContent =
        result.melding ||
        result.reden ||
        "Inloggen mislukt.";

      return;

    }


    chauffeurToken =
      result.token;

    gekozenBus =
      bus;


    localStorage.setItem(
      "chauffeurToken",
      chauffeurToken
    );

    localStorage.setItem(
      "gekozenBus",
      gekozenBus
    );


    document
      .getElementById("busNaam")
      .textContent =
      gekozenBus;


    document
      .getElementById("loginPage")
      .style.display =
      "none";


    document
      .getElementById("scannerPage")
      .style.display =
      "block";


    await updateCapacity();

    startScanner();

    startCapacityTimer();

  }

  catch (e) {

    console.error(e);

    error.textContent =
      "Verbinding met de buscontrole mislukt.";

  }

  finally {

    button.disabled = false;

    button.textContent =
      "INLOGGEN";

  }

}


/* =========================================================
   CAPACITEIT
   ========================================================= */

async function updateCapacity() {

  if (
    !gekozenBus ||
    !chauffeurToken
  ) {

    return;

  }


  try {

    const result =
      await apiCall({

        api: "1",

        action: "capacity",

        bus: gekozenBus,

        token: chauffeurToken

      });


    if (
      !result
    ) {

      return;

    }


    toonCapaciteit(result);

  }

  catch (e) {

    console.log(
      "Capaciteit ophalen mislukt",
      e
    );

  }

}


/*
 * Capaciteit zichtbaar maken
 */

function toonCapaciteit(result) {

  const box =
    document.getElementById(
      "capacityBox"
    );

  const main =
    document.getElementById(
      "capacityMain"
    );

  const free =
    document.getElementById(
      "capacityFree"
    );

  const status =
    document.getElementById(
      "capacityStatus"
    );


  const gebruikt =
    Number(
      result.gebruiktePlaatsen || 0
    );


  const max =
    Number(
      result.maxPlaatsen || 0
    );


  const vrij =
    Number(
      result.vrijePlaatsen || 0
    );


  main.textContent =
    gebruikt +
    " / " +
    max +
    " GESCAND";


  free.textContent =
    vrij +
    " PLAATSEN VRIJ";


  status.textContent =
    result.capaciteitsStatus ||
    "";


  box.classList.remove(
    "capacityNormal",
    "capacityWarning",
    "capacityFull"
  );


  if (
    result.capaciteitsStatus ===
    "BUS VOL"
  ) {

    box.classList.add(
      "capacityFull"
    );

  }

  else if (
    result.capaciteitsStatus ===
    "LAATSTE PLAATSEN"
  ) {

    box.classList.add(
      "capacityWarning"
    );

  }

  else {

    box.classList.add(
      "capacityNormal"
    );

  }

}


/*
 * Capaciteit iedere 3 seconden
 * opnieuw controleren.
 */

function startCapacityTimer() {

  stopCapacityTimer();

  capacityTimer =
    setInterval(
      updateCapacity,
      3000
    );

}


function stopCapacityTimer() {

  if (
    capacityTimer
  ) {

    clearInterval(
      capacityTimer
    );

    capacityTimer = null;

  }

}


/* =========================================================
   SCANNER STARTEN
   ========================================================= */

async function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  if (
    !gekozenBus ||
    !chauffeurToken
  ) {

    return;

  }


  try {

    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Camera starten...";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 12,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.72;

        return {

          width: Math.floor(size),

          height: Math.floor(size)

        };

      }

    };


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerRunning =
      true;


    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Scanner actief – richt op de QR-code.";

  }

  catch (error) {

    console.error(error);


    document
      .getElementById(
        "scannerMessage"
      )
      .innerHTML =
      "🔴 CAMERA KAN NIET STARTEN<br>" +
      "Geef toestemming voor de camera.";

  }

}


/* =========================================================
   SCANNER STOPPEN
   ========================================================= */

async function stopScanner() {

  try {

    if (
      scanner &&
      scannerRunning
    ) {

      await scanner.stop();

      scanner.clear();

    }

  }

  catch (e) {

    console.log(e);

  }


  scannerRunning =
    false;

  scanner = null;


  document
    .getElementById(
      "scannerMessage"
    )
    .textContent =
    "Scanner gestopt.";

}


/* =========================================================
   QR SCAN
   ========================================================= */

async function onScanSuccess(
  decodedText
) {

  if (
    scanBusy
  ) {

    return;

  }


  scanBusy =
    true;


  const badgeId =
    String(
      decodedText
    ).trim();


  document
    .getElementById(
      "loading"
    )
    .style.display =
    "block";


  try {

    const result =
      await apiCall({

        api: "1",

        action: "scan",

        badge: badgeId,

        bus: gekozenBus,

        token: chauffeurToken

      });


    toonResultaat(
      result
    );


    /*
     * Geluid onmiddellijk afspelen
     */

    if (
      result.toegestaan
    ) {

      speelGroenGeluid();

    }

    else {

      speelRoodGeluid();

    }


    /*
     * Capaciteit onmiddellijk
     * bijwerken.
     */

    if (
      result.maxPlaatsen !==
      undefined
    ) {

      toonCapaciteit(
        result
      );

    }

    else {

      updateCapacity();

    }


    /*
     * RESULTAAT SLECHTS 1 SECONDE
     */

    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        1000
      );

  }

  catch (error) {

    console.error(error);


    toonFout(
      "VERBINDINGSPROBLEEM",
      "Controle kon niet worden uitgevoerd."
    );


    speelRoodGeluid();


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        1000
      );

  }

  finally {

    document
      .getElementById(
        "loading"
      )
      .style.display =
      "none";


    /*
     * Heel korte blokkering tegen
     * dubbele camera-detectie.
     */

    setTimeout(
      () => {

        scanBusy =
          false;

      },
      150
    );

  }

}


/* =========================================================
   QR MISLUKT
   ========================================================= */

function onScanFailure(
  errorMessage
) {

  /*
   * Geen melding.
   * De scanner blijft continu zoeken.
   */

}


/* =========================================================
   RESULTAAT TONEN
   ========================================================= */

function toonResultaat(
  result
) {

  const status =
    document.getElementById(
      "status"
    );


  const big =
    document.getElementById(
      "statusBig"
    );


  const name =
    document.getElementById(
      "statusName"
    );


  const reason =
    document.getElementById(
      "statusReason"
    );


  status.style.display =
    "block";


  status.classList.remove(
    "green",
    "red",
    "orange"
  );


  if (
    result.toegestaan
  ) {

    status.classList.add(
      "green"
    );


    big.textContent =
      "🟢 TOEGELATEN";


    name.textContent =
      result.naam ||
      "";


    reason.textContent =
      (
        result.locatie ||
        ""
      ) +
      (
        result.locatie
          ? " • "
          : ""
      ) +
      (
        result.bus ||
        gekozenBus
      );

  }

  else {

    status.classList.add(
      "red"
    );


    big.textContent =
      "🔴 NIET TOEGELATEN";


    name.textContent =
      result.naam ||
      "";


    reason.textContent =
      result.reden ||
      "Geen toegang";

  }

}


/* =========================================================
   FOUT
   ========================================================= */

function toonFout(
  titel,
  tekst
) {

  const status =
    document.getElementById(
      "status"
    );


  status.style.display =
    "block";


  status.classList.remove(
    "green",
    "orange"
  );


  status.classList.add(
    "red"
  );


  document
    .getElementById(
      "statusBig"
    )
    .textContent =
    "🔴 " + titel;


  document
    .getElementById(
      "statusName"
    )
    .textContent =
    "";


  document
    .getElementById(
      "statusReason"
    )
    .textContent =
    tekst;

}


/* =========================================================
   RESULTAAT VERBERGEN
   ========================================================= */

function verbergResultaat() {

  const status =
    document.getElementById(
      "status"
    );


  status.style.display =
    "none";


  document
    .getElementById(
      "statusBig"
    )
    .textContent =
    "";


  document
    .getElementById(
      "statusName"
    )
    .textContent =
    "";


  document
    .getElementById(
      "statusReason"
    )
    .textContent =
    "";

}


/* =========================================================
   UITLOGGEN
   ========================================================= */

async function logout() {

  stopCapacityTimer();

  await stopScanner();


  chauffeurToken =
    "";

  gekozenBus =
    "";


  localStorage.removeItem(
    "chauffeurToken"
  );

  localStorage.removeItem(
    "gekozenBus"
  );


  document
    .getElementById(
      "scannerPage"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "loginPage"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "code"
    )
    .value =
    "";


  document
    .getElementById(
      "bus"
    )
    .value =
    "";


  verbergResultaat();

}


/* =========================================================
   PAGINA LADEN
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    /*
     * Voor deze test altijd opnieuw
     * chauffeur laten aanmelden.
     */

    localStorage.removeItem(
      "chauffeurToken"
    );

    localStorage.removeItem(
      "gekozenBus"
    );

  }
);

</script>
