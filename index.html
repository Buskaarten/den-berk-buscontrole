<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Den Berk Delice - Buscontrole</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f3f3f3;
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
}

body {
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  padding: 8px 10px 30px 10px;
}

/* =========================================================
   LOGIN
   ========================================================= */

#loginPage {
  display: block;
}

#scannerPage {
  display: none;
}

.logo {
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #b5121b;
  margin: 4px 0 2px 0;
}

.subtitle {
  text-align: center;
  font-size: 15px;
  margin-bottom: 10px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

label {
  display: block;
  font-weight: bold;
  margin: 10px 0 5px 0;
}

input,
select,
button {
  width: 100%;
  min-height: 50px;
  border-radius: 10px;
  font-size: 18px;
}

input,
select {
  border: 1px solid #bbb;
  padding: 10px;
  background: white;
}

button {
  border: none;
  background: #b5121b;
  color: white;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

button:disabled {
  background: #999;
}

.error {
  color: #b5121b;
  font-weight: bold;
  text-align: center;
  margin-top: 10px;
}

/* =========================================================
   BUS INFO
   ========================================================= */

.busHeader {
  background: #222;
  color: white;
  border-radius: 12px;
  padding: 9px 10px;
  text-align: center;
  margin-bottom: 7px;
}

.busHeader .busNaam {
  font-size: 23px;
  font-weight: bold;
}

.capacityBox {
  background: white;
  border-radius: 12px;
  padding: 9px;
  margin-bottom: 7px;
  text-align: center;
  box-shadow: 0 2px 7px rgba(0,0,0,0.10);
}

.capacityMain {
  font-size: 22px;
  font-weight: bold;
}

.capacityFree {
  font-size: 18px;
  font-weight: bold;
  margin-top: 2px;
}

.capacityStatus {
  font-size: 15px;
  font-weight: bold;
  margin-top: 3px;
}

.capacityNormal {
  background: #ffffff;
}

.capacityWarning {
  background: #fff1b8;
}

.capacityFull {
  background: #e53935;
  color: white;
}

/* =========================================================
   RESULTAAT
   ========================================================= */

#status {
  display: none;
  width: 100%;
  min-height: 88px;
  border-radius: 13px;
  margin-bottom: 7px;
  padding: 8px 10px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 3px 10px rgba(0,0,0,0.16);
  position: relative;
  z-index: 20;
}

#status.green {
  background: #16a34a;
  color: white;
}

#status.red {
  background: #dc2626;
  color: white;
}

.statusBig {
  font-size: 25px;
  line-height: 28px;
}

.statusName {
  font-size: 19px;
  margin-top: 2px;
  line-height: 22px;
}

.statusReason {
  font-size: 14px;
  margin-top: 2px;
  line-height: 17px;
}

/* =========================================================
   CAMERA
   ========================================================= */

.scannerCard {
  background: white;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

.scannerTitle {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 1px 0 5px 0;
}

#reader {
  width: 100%;
  margin: 0 auto;
  border-radius: 12px;
  overflow: hidden;
  background: black;
}

#reader video {
  border-radius: 10px;
}

#loading {
  display: none;
  text-align: center;
  font-size: 15px;
  font-weight: bold;
  padding: 5px;
}

#scannerMessage {
  text-align: center;
  font-size: 14px;
  color: #666;
  margin-top: 7px;
}

/* =========================================================
   BEDIENING ONDERAAN
   ========================================================= */

.controls {
  margin-top: 14px;
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.08);
}

.controlsTitle {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-bottom: 5px;
}

.controlButton {
  background: #555;
  margin-top: 6px;
  min-height: 44px;
  font-size: 16px;
}

.startButton {
  background: #16803c;
}

.stopButton {
  background: #555;
}

.manualButton {
  background: #2563eb;
}

.logoutButton {
  background: #b5121b;
}

/* =========================================================
   HANDMATIGE CONTROLE
   ========================================================= */

#manualPanel {
  display: none;
  margin-top: 10px;
  background: #f8f8f8;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px;
}

.manualTitle {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 8px;
}

.manualInfo {
  font-size: 13px;
  color: #666;
  text-align: center;
  margin-bottom: 6px;
}

.manualButtons {
  display: flex;
  gap: 7px;
}

.manualButtons button {
  flex: 1;
  font-size: 15px;
}

.cancelButton {
  background: #777;
}

.checkButton {
  background: #16803c;
}

</style>
</head>

<body>

<div class="container">

  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <div id="loginPage">

    <div class="logo">
      DEN BERK DELICE
    </div>

    <div class="subtitle">
      Digitale buscontrole
    </div>

    <div class="card">

      <h2 style="text-align:center;">
        Chauffeur aanmelden
      </h2>

      <label for="code">
        Chauffeurscode
      </label>

      <input
        type="password"
        id="code"
        inputmode="numeric"
        placeholder="Code"
        autocomplete="off">

      <label for="bus">
        Kies bus
      </label>

      <select id="bus">

        <option value="">
          -- Kies bus --
        </option>

        <option value="BUS-A">
          BUS-A
        </option>

        <option value="BUS-B">
          BUS-B
        </option>

        <option value="BUS-C">
          BUS-C
        </option>

        <option value="BUS-D">
          BUS-D
        </option>

      </select>

      <button
        id="loginButton"
        onclick="login()">

        INLOGGEN

      </button>

      <div
        id="loginError"
        class="error">
      </div>

    </div>

  </div>


  <!-- =====================================================
       SCANNER
       ===================================================== -->

  <div id="scannerPage">

    <div class="logo">
      DEN BERK DELICE
    </div>

    <!-- BUS -->

    <div class="busHeader">

      <div style="font-size:12px;">
        BUS
      </div>

      <div
        id="busNaam"
        class="busNaam">

        BUS-A

      </div>

    </div>


    <!-- CAPACITEIT -->

    <div
      id="capacityBox"
      class="capacityBox">

      <div
        id="capacityMain"
        class="capacityMain">

        0 / 0 GESCAND

      </div>

      <div
        id="capacityFree"
        class="capacityFree">

        0 PLAATSEN VRIJ

      </div>

      <div
        id="capacityStatus"
        class="capacityStatus">
      </div>

    </div>


    <!-- RESULTAAT BOVEN CAMERA -->

    <div id="status">

      <div
        id="statusBig"
        class="statusBig">
      </div>

      <div
        id="statusName"
        class="statusName">
      </div>

      <div
        id="statusReason"
        class="statusReason">
      </div>

    </div>


    <!-- CAMERA -->

    <div class="scannerCard">

      <div class="scannerTitle">
        📷 SCAN BUSKAART
      </div>

      <div id="reader"></div>

      <div
        id="loading">

        Controleren...

      </div>

      <div id="scannerMessage">

        Richt de camera op de QR-code.

      </div>

    </div>


    <!-- =================================================
         BEDIENING ONDERAAN
         ================================================= -->

    <div class="controls">

      <div class="controlsTitle">
        BEDIENING
      </div>

      <button
        class="controlButton startButton"
        onclick="startScanner()">

        ▶ SCANNER STARTEN

      </button>

      <button
        class="controlButton stopButton"
        onclick="stopScanner()">

        ■ SCANNER STOPPEN

      </button>


      <!-- HANDMATIGE CONTROLE -->

      <button
        class="controlButton manualButton"
        onclick="openManualPanel()">

        👤 HANDMATIGE CONTROLE

      </button>


      <div id="manualPanel">

        <div class="manualTitle">
          Handmatige controle
        </div>

        <div class="manualInfo">

          Gebruik dit alleen wanneer de medewerker
          zijn buskaart vergeten is.

        </div>

        <label for="manualPersonnel">
          Personeelsnummer
        </label>

        <input
          id="manualPersonnel"
          type="text"
          inputmode="numeric"
          placeholder="Personeelsnummer"
          autocomplete="off">

        <label for="manualLocation">
          Locatie
        </label>

        <select id="manualLocation">

          <option value="">
            -- Eerst personeelsnummer ingeven --
          </option>

        </select>

        <div class="manualButtons">

          <button
            class="cancelButton"
            onclick="closeManualPanel()">

            ANNULEREN

          </button>

          <button
            class="checkButton"
            onclick="manualCheck()">

            CONTROLEREN

          </button>

        </div>

      </div>


      <button
        class="controlButton logoutButton"
        onclick="logout()">

        UITLOGGEN

      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURATIE
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyilW3j28SCm-7mch8tgdDkp9RzQsi_J-RsUD3ziFP26LVlJuE06fEbiCpPBVqUQntD4w/exec";

let chauffeurToken = "";

let gekozenBus = "";

let scanner = null;

let scannerRunning = false;

let scanBusy = false;

let capacityTimer = null;

let resultTimer = null;

let audioContext = null;


/*
 * NIEUW:
 * Houdt de laatst gescande QR bij.
 *
 * html5-qrcode kan dezelfde QR-code meerdere
 * keren per seconde herkennen.
 *
 * Daarom blokkeren we dezelfde QR tijdelijk.
 */

let laatsteGesandeBadge = "";

let laatsteScanTijd = 0;

const SCAN_BLOKKADE_MS = 5000;


/* =========================================================
   AUDIO
   ========================================================= */

function initAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    }

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }

  }

  catch (e) {

    console.log(
      "Audio niet beschikbaar",
      e
    );

  }

}


/* =========================================================
   GROEN GELUID
   ========================================================= */

function speelGroenGeluid() {

  try {

    initAudio();

    const now =
      audioContext.currentTime;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
      880,
      now
    );

    oscillator.frequency.setValueAtTime(
      1100,
      now + 0.10
    );

    gain.gain.setValueAtTime(
      0.25,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.22
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start(now);

    oscillator.stop(
      now + 0.23
    );

  }

  catch (e) {

    console.log(e);

  }

}


/* =========================================================
   ROOD GELUID
   ========================================================= */

function speelRoodGeluid() {

  try {

    initAudio();

    const now =
      audioContext.currentTime;


    /*
     * Rood ongeveer 2x zo luid
     * als groen.
     */

    const osc1 =
      audioContext.createOscillator();

    const gain1 =
      audioContext.createGain();

    osc1.type = "square";

    osc1.frequency.setValueAtTime(
      330,
      now
    );

    gain1.gain.setValueAtTime(
      0.50,
      now
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.28
    );

    osc1.connect(gain1);

    gain1.connect(
      audioContext.destination
    );

    osc1.start(now);

    osc1.stop(
      now + 0.29
    );


    const osc2 =
      audioContext.createOscillator();

    const gain2 =
      audioContext.createGain();

    osc2.type = "square";

    osc2.frequency.setValueAtTime(
      220,
      now + 0.30
    );

    gain2.gain.setValueAtTime(
      0.50,
      now + 0.30
    );

    gain2.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.58
    );

    osc2.connect(gain2);

    gain2.connect(
      audioContext.destination
    );

    osc2.start(
      now + 0.30
    );

    osc2.stop(
      now + 0.59
    );


    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        180,
        80,
        180
      ]);

    }

  }

  catch (e) {

    console.log(e);

  }

}


/* =========================================================
   API
   ========================================================= */

function apiCall(params) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams(
          params
        );


      query.set(
        "callback",
        callbackName
      );


      script.src =
        API_URL +
        "?" +
        query.toString();


      window[callbackName] =
        function(data) {

          try {

            resolve(data);

          }

          finally {

            delete window[
              callbackName
            ];

            if (
              script.parentNode
            ) {

              script.parentNode.removeChild(
                script
              );

            }

          }

        };


      script.onerror =
        function() {

          delete window[
            callbackName
          ];

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }

          reject(
            new Error(
              "Kan server niet bereiken."
            )
          );

        };


      document.body.appendChild(
        script
      );


      setTimeout(
        () => {

          if (
            window[callbackName]
          ) {

            delete window[
              callbackName
            ];

            if (
              script.parentNode
            ) {

              script.parentNode.removeChild(
                script
              );

            }

            reject(
              new Error(
                "Server reageert niet."
              )
            );

          }

        },
        15000
      );

    }

  );

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

  initAudio();

  const code =
    document
      .getElementById("code")
      .value
      .trim();


  const bus =
    document
      .getElementById("bus")
      .value;


  const error =
    document
      .getElementById("loginError");


  error.textContent = "";


  if (!code) {

    error.textContent =
      "Vul de chauffeurscode in.";

    return;

  }


  if (!bus) {

    error.textContent =
      "Kies eerst een bus.";

    return;

  }


  const button =
    document
      .getElementById("loginButton");


  button.disabled = true;

  button.textContent =
    "INLOGGEN...";


  try {

    const result =
      await apiCall({

        api: "1",

        action: "login",

        code: code

      });


    if (
      !result.toegestaan
    ) {

      error.textContent =
        result.melding ||
        result.reden ||
        "Inloggen mislukt.";

      return;

    }


    chauffeurToken =
      result.token;


    gekozenBus =
      bus;


    document
      .getElementById("busNaam")
      .textContent =
      gekozenBus;


    document
      .getElementById("loginPage")
      .style.display =
      "none";


    document
      .getElementById("scannerPage")
      .style.display =
      "block";


    await updateCapacity();

    startScanner();

    startCapacityTimer();

  }

  catch (e) {

    console.error(e);

    error.textContent =
      "Verbinding met de buscontrole mislukt.";

  }

  finally {

    button.disabled = false;

    button.textContent =
      "INLOGGEN";

  }

}


/* =========================================================
   CAPACITEIT
   ========================================================= */

async function updateCapacity() {

  if (
    !gekozenBus ||
    !chauffeurToken
  ) {

    return;

  }


  try {

    const result =
      await apiCall({

        api: "1",

        action: "capacity",

        bus: gekozenBus,

        token: chauffeurToken

      });


    if (
      result
    ) {

      toonCapaciteit(result);

    }

  }

  catch (e) {

    console.log(
      "Capaciteit ophalen mislukt",
      e
    );

  }

}


function toonCapaciteit(result) {

  const box =
    document.getElementById(
      "capacityBox"
    );


  const main =
    document.getElementById(
      "capacityMain"
    );


  const free =
    document.getElementById(
      "capacityFree"
    );


  const status =
    document.getElementById(
      "capacityStatus"
    );


  const gebruikt =
    Number(
      result.gebruiktePlaatsen || 0
    );


  const max =
    Number(
      result.maxPlaatsen || 0
    );


  const vrij =
    Number(
      result.vrijePlaatsen || 0
    );


  main.textContent =
    gebruikt +
    " / " +
    max +
    " GESCAND";


  free.textContent =
    vrij +
    " PLAATSEN VRIJ";


  status.textContent =
    result.capaciteitsStatus ||
    "";


  box.classList.remove(
    "capacityNormal",
    "capacityWarning",
    "capacityFull"
  );


  if (
    result.capaciteitsStatus ===
    "BUS VOL"
  ) {

    box.classList.add(
      "capacityFull"
    );

  }

  else if (
    result.capaciteitsStatus ===
    "LAATSTE PLAATSEN"
  ) {

    box.classList.add(
      "capacityWarning"
    );

  }

  else {

    box.classList.add(
      "capacityNormal"
    );

  }

}


function startCapacityTimer() {

  stopCapacityTimer();

  capacityTimer =
    setInterval(
      updateCapacity,
      3000
    );

}


function stopCapacityTimer() {

  if (
    capacityTimer
  ) {

    clearInterval(
      capacityTimer
    );

    capacityTimer = null;

  }

}


/* =========================================================
   SCANNER STARTEN
   ========================================================= */

async function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  if (
    !gekozenBus ||
    !chauffeurToken
  ) {

    return;

  }


  try {

    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Camera starten...";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 12,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.72;


        return {

          width:
            Math.floor(size),

          height:
            Math.floor(size)

        };

      }

    };


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerRunning =
      true;


    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Scanner actief – richt op de QR-code.";

  }

  catch (error) {

    console.error(error);

    document
      .getElementById(
        "scannerMessage"
      )
      .innerHTML =
      "🔴 CAMERA KAN NIET STARTEN<br>" +
      "Geef toestemming voor de camera.";

  }

}


/* =========================================================
   SCANNER STOPPEN
   ========================================================= */

async function stopScanner() {

  try {

    if (
      scanner &&
      scannerRunning
    ) {

      await scanner.stop();

      scanner.clear();

    }

  }

  catch (e) {

    console.log(e);

  }


  scannerRunning =
    false;


  scanner = null;


  document
    .getElementById(
      "scannerMessage"
    )
    .textContent =
    "Scanner gestopt.";

}


/* =========================================================
   QR SCAN
   ========================================================= */

async function onScanSuccess(
  decodedText
) {

  /*
   * BELANGRIJK:
   *
   * html5-qrcode kan dezelfde QR
   * meerdere keren onmiddellijk lezen.
   *
   * Daarom blokkeren we dezelfde
   * QR-code gedurende 5 seconden.
   */

  const badgeId =
    String(
      decodedText || ""
    ).trim();


  const nu =
    Date.now();


  if (!badgeId) {

    return;

  }


  if (
    badgeId ===
      laatsteGesandeBadge &&
    (
      nu -
      laatsteScanTijd
    ) <
      SCAN_BLOKKADE_MS
  ) {

    console.log(
      "Dubbele QR-scan genegeerd:",
      badgeId
    );

    return;

  }


  laatsteGesandeBadge =
    badgeId;


  laatsteScanTijd =
    nu;


  if (
    scanBusy
  ) {

    return;

  }


  scanBusy =
    true;


  document
    .getElementById(
      "loading"
    )
    .style.display =
    "block";


  try {

    const result =
      await apiCall({

        api: "1",

        action: "scan",

        badge: badgeId,

        bus: gekozenBus,

        token: chauffeurToken

      });


    toonResultaat(
      result
    );


    if (
      result.toegestaan
    ) {

      speelGroenGeluid();

    }

    else {

      speelRoodGeluid();

    }


    /*
     * BELANGRIJK:
     *
     * Altijd opnieuw de capaciteit
     * ophalen.
     *
     * Dus zowel na groen als rood.
     */

    await updateCapacity();


    /*
     * Groen én rood blijven
     * 3 seconden zichtbaar.
     */

    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

  catch (error) {

    console.error(error);


    toonFout(
      "VERBINDINGSPROBLEEM",
      "Controle kon niet worden uitgevoerd."
    );


    speelRoodGeluid();


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

  finally {

    document
      .getElementById(
        "loading"
      )
      .style.display =
      "none";


    /*
     * Scanner blijft actief.
     */

    setTimeout(
      () => {

        scanBusy =
          false;

      },
      150
    );

  }

}

  errorMessage
) {

  /*
   * Geen melding.
   * Scanner blijft zoeken.
   */

}


/* =========================================================
   RESULTAAT
   ========================================================= */

function toonResultaat(
  result
) {

  const status =
    document.getElementById(
      "status"
    );


  const big =
    document.getElementById(
      "statusBig"
    );


  const name =
    document.getElementById(
      "statusName"
    );


  const reason =
    document.getElementById(
      "statusReason"
    );


  status.style.display =
    "block";


  status.classList.remove(
    "green",
    "red"
  );


  if (
    result.toegestaan
  ) {

    status.classList.add(
      "green"
    );


    big.textContent =
      "🟢 TOEGELATEN";


    name.textContent =
      result.naam ||
      "";


    reason.textContent =
      (
        result.locatie ||
        ""
      ) +
      (
        result.locatie
          ? " • "
          : ""
      ) +
      (
        result.bus ||
        gekozenBus
      );

  }

  else {

    status.classList.add(
      "red"
    );


    big.textContent =
      "🔴 NIET TOEGELATEN";


    name.textContent =
      result.naam ||
      "";


    reason.textContent =
      result.reden ||
      "Geen toegang";

  }

}


/* =========================================================
   FOUT
   ========================================================= */

function toonFout(
  titel,
  tekst
) {

  const status =
    document.getElementById(
      "status"
    );


  status.style.display =
    "block";


  status.classList.remove(
    "green"
  );


  status.classList.add(
    "red"
  );


  document
    .getElementById(
      "statusBig"
    )
    .textContent =
    "🔴 " + titel;


  document
    .getElementById(
      "statusName"
    )
    .textContent =
    "";


  document
    .getElementById(
      "statusReason"
    )
    .textContent =
    tekst;

}


/* =========================================================
   RESULTAAT VERBERGEN

function verbergResultaat() {

  document

    )

/* =========================================================
   LOCATIES OPHALEN VOOR HANDMATIGE CONTROLE
   ========================================================= */

async function laadManualLocaties() {

  const personnel =
    document
      .getElementById(
        "manualPersonnel"
      )
      .value
      .trim();


  const select =
    document.getElementById(
      "manualLocation"
    );


  if (
    !personnel ||
    !chauffeurToken
  ) {

    select.innerHTML =
      '<option value="">-- Eerst personeelsnummer ingeven --</option>';

    return;

  }


  try {

    const result =
      await apiCall({

        api: "1",

        action: "findEmployee",

        personeelsnummer:
          personnel,

        token:
          chauffeurToken

      });


    const medewerkers =
      result.medewerkers ||
      result.employees ||
      result.items ||
      [];


    select.innerHTML =
      '<option value="">-- Kies locatie --</option>';


    const locaties = [];


    medewerkers.forEach(
      function(m) {

        const locatie =
          String(
            m.locatie || ""
          ).trim();


        if (
          locatie &&
          !locaties.includes(
            locatie
          )
        ) {

          locaties.push(
            locatie
          );

        }

      }
    );


    locaties.forEach(
      function(locatie) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          locatie;


        option.textContent =
          locatie;


        select.appendChild(
          option
        );

      }
    );


    /*
     * Als er maar één locatie is,
     * automatisch selecteren.
     */

    if (
      locaties.length === 1
    ) {

      select.value =
        locaties[0];

    }


    if (
      !locaties.length
    ) {

      select.innerHTML =
        '<option value="">-- Personeelsnummer niet gevonden --</option>';

    }

  }

  catch (e) {

    console.error(
      "Locaties ophalen mislukt",
      e
    );


    select.innerHTML =
      '<option value="">-- Locatie niet gevonden --</option>';

  }

}


/* =========================================================
   HANDMATIGE CONTROLE UITVOEREN
   ========================================================= */

async function manualCheck() {

  const personnel =
    document
      .getElementById(
        "manualPersonnel"
      )
      .value
      .trim();


  const location =
    document
      .getElementById(
        "manualLocation"
      )
      .value;


  if (!personnel) {

    alert(
      "Vul het personeelsnummer in."
    );

    return;

  }


  if (!location) {

    alert(
      "Kies de locatie."
    );

    return;

  }


  try {

    /*
     * BELANGRIJK:
     *
     * De backend verwacht:
     *
     * personeelsnummer
     *
     * en NIET:
     *
     * personnel
     */

    const result =
      await apiCall({

        api: "1",

        action: "manual",

        personeelsnummer:
          personnel,

        locatie:
          location,

        bus:
          gekozenBus,

        token:
          chauffeurToken

      });


    toonResultaat(
      result
    );


    if (
      result.toegestaan
    ) {

      speelGroenGeluid();

    }

    else {

      speelRoodGeluid();

    }


    /*
     * Altijd actuele capaciteit
     * opnieuw ophalen.
     */

    await updateCapacity();


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );


    closeManualPanel();

  }

  catch (error) {

    console.error(error);


    toonFout(
      "FOUT",
      "Handmatige controle kon niet worden uitgevoerd."
    );


    speelRoodGeluid();


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

}


/* =========================================================
   AUTOMATISCH LOCATIES LADEN BIJ INVOER PERSONEELSNUMMER
   ========================================================= */

document
  .getElementById(
    "manualPersonnel"
  )
  .addEventListener(
    "input",
    function() {

      clearTimeout(
        window.manualLocationTimer
      );


      window.manualLocationTimer =
        setTimeout(
          laadManualLocaties,
