<script>

/* =========================================================
   CONFIGURATIE
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyM-YS45mfx04fW_LAICz64-FoxV2cZc9oMHAmQfRZU8lbVZCOFiSkF2KbqrJZ95RK_-A/exec";


let chauffeurToken = "";

let gekozenBus = "";

let scanner = null;

let scannerRunning = false;

let scanBusy = false;

let capacityTimer = null;

let resultTimer = null;

let audioContext = null;


/*
 * Voorkomt dat dezelfde QR-code
 * door de camera meerdere keren
 * onmiddellijk wordt gelezen.
 */

let laatsteGesandeBadge = "";

let laatsteScanTijd = 0;

const SCAN_BLOKKADE_MS = 5000;


/* =========================================================
   AUDIO INITIALISEREN
   ========================================================= */

function initAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

  }

  catch (e) {

    console.log(
      "Audio niet beschikbaar:",
      e
    );

  }

}


/* =========================================================
   GROEN GELUID
   ========================================================= */

function speelGroenGeluid() {

  try {

    initAudio();

    const now =
      audioContext.currentTime;


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      880,
      now
    );


    oscillator.frequency.setValueAtTime(
      1100,
      now + 0.10
    );


    gain.gain.setValueAtTime(
      0.25,
      now
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.22
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start(now);

    oscillator.stop(
      now + 0.23
    );

  }

  catch (e) {

    console.log(e);

  }

}


/* =========================================================
   ROOD GELUID
   ========================================================= */

function speelRoodGeluid() {

  try {

    initAudio();

    const now =
      audioContext.currentTime;


    /*
     * Eerste piep
     */

    const osc1 =
      audioContext.createOscillator();

    const gain1 =
      audioContext.createGain();


    osc1.type =
      "square";


    osc1.frequency.setValueAtTime(
      330,
      now
    );


    gain1.gain.setValueAtTime(
      0.50,
      now
    );


    gain1.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.28
    );


    osc1.connect(gain1);

    gain1.connect(
      audioContext.destination
    );


    osc1.start(now);

    osc1.stop(
      now + 0.29
    );


    /*
     * Tweede piep
     */

    const osc2 =
      audioContext.createOscillator();

    const gain2 =
      audioContext.createGain();


    osc2.type =
      "square";


    osc2.frequency.setValueAtTime(
      220,
      now + 0.30
    );


    gain2.gain.setValueAtTime(
      0.50,
      now + 0.30
    );


    gain2.gain.exponentialRampToValueAtTime(
      0.001,
      now + 0.58
    );


    osc2.connect(gain2);

    gain2.connect(
      audioContext.destination
    );


    osc2.start(
      now + 0.30
    );

    osc2.stop(
      now + 0.59
    );


    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        180,
        80,
        180
      ]);

    }

  }

  catch (e) {

    console.log(e);

  }

}


/* =========================================================
   API CALL
   ========================================================= */
function apiCall(params) {

  return new Promise(function(resolve, reject) {

    let poging = 0;
    const maximaal = 3;

    function probeer() {

      poging++;

      const callbackName =
        "denBerkCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 1000000);

      const script = document.createElement("script");

      const query = new URLSearchParams(params);

      query.set("callback", callbackName);

      let klaar = false;

      function opruimen() {

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }
      }

      function opnieuwProberen(fout) {

        if (klaar) return;

        klaar = true;

        opruimen();

        if (poging < maximaal) {

          const wachttijd =
            poging === 1 ? 800 : 1600;

          setTimeout(function() {
            probeer();
          }, wachttijd);

        } else {

          reject(fout);

        }
      }

      window[callbackName] = function(data) {

        if (klaar) return;

        klaar = true;

        opruimen();

        resolve(data);
      };

      script.src =
        API_URL +
        "?" +
        query.toString();

      script.async = true;

      script.onerror = function() {

        opnieuwProberen(
          new Error(
            "Verbinding met de buscontrole mislukt."
          )
        );

      };

      document.body.appendChild(script);

      setTimeout(function() {

        if (klaar) return;

        opnieuwProberen(
          new Error(
            "API timeout."
          )
        );

      }, 10000);

    }

    probeer();

  });

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

  initAudio();


  const code =
    document
      .getElementById(
        "code"
      )
      .value
      .trim();


  const bus =
    document
      .getElementById(
        "bus"
      )
      .value;


  const error =
    document
      .getElementById(
        "loginError"
      );


  const button =
    document
      .getElementById(
        "loginButton"
      );


  error.textContent =
    "";


  if (!code) {

    error.textContent =
      "Vul de chauffeurscode in.";

    return;

  }


  if (!bus) {

    error.textContent =
      "Kies eerst een bus.";

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "AANMELDEN...";


  try {

    const result =
      await apiCall({

        api: "1",

        action: "login",

        code: code

      });


    if (
      !result ||
      !result.toegestaan
    ) {

      error.textContent =
        result &&
        result.reden
          ? result.reden
          : "Aanmelden geweigerd.";

      return;

    }


    chauffeurToken =
      result.token;


    gekozenBus =
      bus;


    document
      .getElementById(
        "busNaam"
      )
      .textContent =
      bus;


    document
      .getElementById(
        "loginPage"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "scannerPage"
      )
      .style.display =
      "block";


    await updateCapacity();


    startScanner();


    startCapacityTimer();

  }

  catch (e) {

    console.error(e);

    error.textContent =
      "Verbinding met de buscontrole mislukt.";

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      "INLOGGEN";

  }

}


/* =========================================================
   CAPACITEIT OPHALEN
   ========================================================= */

async function updateCapacity() {

  if (
    !gekozenBus ||
    !chauffeurToken
  ) {

    return;

  }


  try {

    const result =
      await apiCall({

        api: "1",

        action: "capacity",

        bus: gekozenBus,

        token: chauffeurToken

      });


    if (result) {

      toonCapaciteit(
        result
      );

    }

  }

  catch (e) {

    console.log(
      "Capaciteit ophalen mislukt:",
      e
    );

  }

}


/* =========================================================
   CAPACITEIT TONEN
   ========================================================= */

function toonCapaciteit(result) {

  const box =
    document.getElementById(
      "capacityBox"
    );


  const main =
    document.getElementById(
      "capacityMain"
    );


  const free =
    document.getElementById(
      "capacityFree"
    );


  const status =
    document.getElementById(
      "capacityStatus"
    );


  const gebruikt =
    Number(
      result.gebruiktePlaatsen || 0
    );


  const max =
    Number(
      result.maxPlaatsen || 0
    );


  const vrij =
    Number(
      result.vrijePlaatsen || 0
    );


  main.textContent =
    gebruikt +
    " / " +
    max +
    " GESCAND";


  free.textContent =
    vrij +
    " PLAATSEN VRIJ";


  status.textContent =
    result.capaciteitsStatus ||
    "";


  box.classList.remove(
    "capacityNormal",
    "capacityWarning",
    "capacityFull"
  );


  if (
    result.capaciteitsStatus ===
    "BUS VOL"
  ) {

    box.classList.add(
      "capacityFull"
    );

  }

  else if (
    result.capaciteitsStatus ===
    "LAATSTE PLAATSEN"
  ) {

    box.classList.add(
      "capacityWarning"
    );

  }

  else {

    box.classList.add(
      "capacityNormal"
    );

  }

}


/* =========================================================
   CAPACITEIT AUTOMATISCH VERNIEUWEN
   ========================================================= */

function startCapacityTimer() {

  stopCapacityTimer();


  capacityTimer =
    setInterval(
      updateCapacity,
      3000
    );

}


function stopCapacityTimer() {

  if (
    capacityTimer
  ) {

    clearInterval(
      capacityTimer
    );

    capacityTimer =
      null;

  }

}


/* =========================================================
   SCANNER STARTEN
   ========================================================= */

async function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  if (
    !gekozenBus ||
    !chauffeurToken
  ) {

    return;

  }


  try {

    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Camera starten...";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 12,

      qrbox:
        function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70;


          return {

            width: size,

            height: size

          };

        },

      aspectRatio: 1.0

    };


    await scanner.start(
      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure
    );


    scannerRunning =
      true;


    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Richt de camera op de QR-code.";

  }

  catch (e) {

    console.error(e);


    scannerRunning =
      false;


    scanner =
      null;


    document
      .getElementById(
        "scannerMessage"
      )
      .textContent =
      "Camera kon niet worden gestart.";

  }

}


/* =========================================================
   SCANNER STOPPEN
   ========================================================= */

async function stopScanner() {

  if (!scanner) {

    scannerRunning =
      false;

    return;

  }


  try {

    await scanner.stop();

  }

  catch (e) {

    console.log(
      "Scanner stoppen:",
      e
    );

  }


  try {

    scanner.clear();

  }

  catch (e) {

    console.log(e);

  }


  scannerRunning =
    false;


  scanner =
    null;


  document
    .getElementById(
      "scannerMessage"
    )
    .textContent =
    "Scanner gestopt.";

}


/* =========================================================
   QR SCAN MISLUKT
   ========================================================= */

function onScanFailure(errorMessage) {

  /*
   * Bewust leeg.
   *
   * De camera blijft continu
   * zoeken naar een QR-code.
   */

}


/* =========================================================
   QR SCAN SUCCES
   ========================================================= */

async function onScanSuccess(
  decodedText
) {

  const badgeId =
    String(
      decodedText || ""
    ).trim();


  if (!badgeId) {

    return;

  }


  /*
   * Dezelfde QR niet onmiddellijk
   * opnieuw verwerken.
   */

  const nu =
    Date.now();


  if (
    badgeId ===
      laatsteGesandeBadge &&
    (
      nu -
      laatsteScanTijd
    ) <
      SCAN_BLOKKADE_MS
  ) {

    return;

  }


  laatsteGesandeBadge =
    badgeId;


  laatsteScanTijd =
    nu;


  /*
   * Voorkom dat twee scans
   * tegelijkertijd naar de
   * server gaan.
   */

  if (
    scanBusy
  ) {

    return;

  }


  scanBusy =
    true;


  document
    .getElementById(
      "loading"
    )
    .style.display =
    "block";


  try {

    const result =
      await apiCall({

        api: "1",

        action: "scan",

        badge: badgeId,

        bus: gekozenBus,

        token: chauffeurToken

      });


    toonResultaat(
      result
    );


    /*
     * Geluid
     */

    if (
      result &&
      result.toegestaan
    ) {

      speelGroenGeluid();

    }

    else {

      speelRoodGeluid();

    }


    /*
     * Capaciteit direct bijwerken
     * als de backend deze terugstuurt.
     */

    if (
      result &&
      result.maxPlaatsen !==
        undefined
    ) {

      toonCapaciteit(
        result
      );

    }

    else {

      await updateCapacity();

    }


    /*
     * Extra servercontrole na
     * een succesvolle groene scan.
     *
     * Hierdoor blijft de teller
     * gelijk aan Google Sheets.
     */

    if (
      result &&
      result.toegestaan
    ) {

      setTimeout(
        updateCapacity,
        500
      );

    }


    /*
     * Resultaat 3 seconden zichtbaar.
     */

    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

  catch (error) {

    console.error(
      error
    );


    toonFout(
      "VERBINDINGSPROBLEEM",
      "Controle kon niet worden uitgevoerd."
    );


    speelRoodGeluid();


    clearTimeout(
      resultTimer
    );


    resultTimer =
      setTimeout(
        verbergResultaat,
        3000
      );

  }

  finally {

    document
      .getElementById(
        "loading"
      )
      .style.display =
      "none";


    /*
     * Scanner blijft actief.
     */

    scanBusy =
      false;

  }

}


/* =========================================================
   RESULTAAT TONEN
   ========================================================= */

function toonResultaat(
  result
) {

  const status =
    document.getElementById(
      "status"
    );


  const big =
    document.getElementById(
      "statusBig"
    );


  const name =
    document.getElementById(
      "statusName"
    );


  const reason =
    document.getElementById(
      "statusReason"
    );


  status.classList.remove(
    "green",
    "red"
  );


  if (
    result &&
    result.toegestaan
  ) {

    status.classList.add(
      "green"
    );


    big.textContent =
      "✓ TOEGESTAAN";

  }

  else {

    status.classList.add(
      "red"
    );


    big.textContent =
      "✕ NIET TOEGESTAAN";

  }


  name.textContent =
    result &&
    (
      result.naam ||
      result.voornaam ||
      ""
    );


  reason.textContent =
    result &&
    (
      result.reden ||
      result.message ||
      ""
    );


  status.style.display =
    "block";

}


/* =========================================================
   FOUT TONEN
   ========================================================= */

function toonFout(
  titel,
  tekst
) {

  const status =
    document.getElementById(
      "status"
    );


  const big =
    document.getElementById(
      "statusBig"
    );


  const name =
    document.getElementById(
      "statusName"
    );


  const reason =
    document.getElementById(
      "statusReason"
    );


  status.classList.remove(
    "green"
  );


  status.classList.add(
    "red"
  );


  big.textContent =
    titel;


  name.textContent =
    "";


  reason.textContent =
    tekst;


  status.style.display =
    "block";

}


/* =========================================================
   RESULTAAT VERBERGEN
   ========================================================= */

function verbergResultaat() {

  document
    .getElementById(
      "status"
    )
    .style.display =
    "none";

}


/* =========================================================
   UITLOGGEN
   ========================================================= */

async function logout() {

  stopCapacityTimer();


  await stopScanner();


  chauffeurToken =
    "";


  gekozenBus =
    "";


  document
    .getElementById(
      "scannerPage"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "loginPage"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "code"
    )
    .value =
    "";


  document
    .getElementById(
      "bus"
    )
    .value =
    "";


  verbergResultaat();

}
